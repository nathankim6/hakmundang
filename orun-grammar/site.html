function doSwap(seq,no){
  const i=S.exam.qs.findIndex(x=>x.seq===seq); if(i<0) return;
  const q=S.exam.qs[i], c=byId[q.catId]; if(!c) return;
  const nq=c.questions.filter(x=>x.no===no)[0]; if(!nq) return;
  S.exam.qs[i]=Object.assign({cat:c.name,catId:c.id,grade:c.grade},nq,{seq:seq});
  modalOff(); refreshPreview(); toast(seq+'번 문항을 교체했습니다');}
function reroll(seq){
  const q=S.exam.qs.filter(x=>x.seq===seq)[0]; if(!q) return;
  const c=byId[q.catId]; const used={}; S.exam.qs.forEach(x=>{used[x.catId+'#'+x.no]=1;});
  const p=c.questions.filter(x=>x.level===q.level&&x.type===q.type&&!used[c.id+'#'+x.no]);
  if(!p.length){ toast('교체할 후보가 없습니다'); return; }

let CRC=null;
function crc32(u8){
  if(!CRC){CRC=new Uint32Array(256);
    for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);CRC[n]=c>>>0;}}
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=CRC[(c^u8[i])&255]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
function zipStore(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  files.forEach(f=>{
    const data=typeof f.data==='string'?enc.encode(f.data):f.data;
    const nm=enc.encode(f.name), crc=crc32(data);
    const loc=[80,75,3,4].concat(u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nm.length),u16(0));
    parts.push(new Uint8Array(loc),nm,data);
    cen.push({nm:nm,crc:crc,len:data.length,off:off});
    off+=loc.length+nm.length+data.length;
  });
  const cd=[]; let cdl=0;
  cen.forEach(c=>{
    const hh=[80,75,1,2].concat(u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c.crc),u32(c.len),u32(c.len),
      u16(c.nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off));
    cd.push(new Uint8Array(hh),c.nm); cdl+=hh.length+c.nm.length;
  });
  cd.push(new Uint8Array([80,75,5,6].concat(u16(0),u16(0),u16(cen.length),u16(cen.length),u32(cdl),u32(off),u16(0))));
  return new Blob(parts.concat(cd),{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function wRuns(t,o){
  o=o||{}; const out=[], P=[]; let last=0,m; const re=/<u>([\s\S]*?)<\/u>/g;
  while((m=re.exec(t))){ if(m.index>last)P.push([t.slice(last,m.index),0]); P.push([m[1],1]); last=re.lastIndex; }
  if(last<t.length)P.push([t.slice(last),0]);
  P.forEach(p=>{ String(p[0]).split('\n').forEach((line,i)=>{
    if(i) out.push('<w:r><w:br/></w:r>');
    out.push('<w:r><w:rPr>'+(o.b?'<w:b/>':'')+(p[1]?'<w:u w:val="single"/>':'')+
      (o.c?'<w:color w:val="'+o.c+'"/>':'')+'<w:sz w:val="'+(o.sz||20)+'"/><w:szCs w:val="'+(o.sz||20)+'"/></w:rPr>'+
      '<w:t xml:space="preserve">'+X(line)+'</w:t></w:r>');});});
  return out.join('');
}
function wP(runs,o){o=o||{};
  const box=o.box?'<w:pBdr>'+['top','left','bottom','right'].map(k=>
      '<w:'+k+' w:val="single" w:sz="4" w:space="'+(k==='top'||k==='bottom'?3:5)+'" w:color="CCD6E2"/>').join('')+'</w:pBdr>':'';
  return '<w:p><w:pPr><w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after||40)+'" w:line="'+(o.line||264)+'" w:lineRule="auto"/>'+
    (o.ind?'<w:ind w:left="'+o.ind+'" w:right="'+(o.right||0)+'" w:hanging="'+(o.hang||0)+'"/>':'')+
    (o.align?'<w:jc w:val="'+o.align+'"/>':'')+
    (o.bdr?'<w:pBdr><w:bottom w:val="single" w:sz="'+o.bdr+'" w:space="4" w:color="0F1B2D"/></w:pBdr>':'')+
    box+(o.shd?'<w:shd w:val="clear" w:fill="'+o.shd+'"/>':'')+
    '</w:pPr>'+runs+'</w:p>';}
/* 본문 상자 = 줄바꿈으로 이어 붙인 한 문단에 사방 테두리 */
function wBox(P){
  if(!P.lines.length) return '';
  const runs=P.lines.map(function(l,i){
    return (i?'<w:r><w:br/></w:r>':'')+(l.mk?wRuns(l.mk+' ',{b:1,sz:19}):'')+wRuns(l.tx,{sz:19});}).join('');
  return wP(runs,{after:36,ind:300,right:120,shd:'FAFBFD',box:1});}

  const b=atob(String(d).split(',').pop()), u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);

/* 서버 동기화(편집본과 같은 테이블, folder| 접두어) */
async function syncFolders(silent){
  try{
    if(FOLDERS.length){
      const rows=FOLDERS.map(f=>({key:'folder|'+f.id,payload:f,editor:editorName(),
        updated_at:new Date(f.ts).toISOString()}));
      const r=await fetch(SB.url+'/rest/v1/'+SB.table,{method:'POST',
        headers:sbHead({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'}),
        body:JSON.stringify(rows)});
      if(!r.ok) throw new Error('push');
    }
    while(FDEL.length){ const id=FDEL.pop();
      await fetch(SB.url+'/rest/v1/'+SB.table+'?key=eq.'+encodeURIComponent('folder|'+id),
        {method:'DELETE',headers:sbHead({Prefer:'return=minimal'})}); }
  }catch(e){ if(!silent) toast('폴더 서버 저장 실패 — 로컬에는 저장됐습니다'); } }
async function pullFolders(){
  const r=await fetch(SB.url+'/rest/v1/'+SB.table+'?select=key,payload,updated_at&key=like.folder%7C*',
    {headers:sbHead()});
  if(!r.ok) return 0;
  const rows=await r.json(); let n=0;
  rows.forEach(row=>{ const f=row.payload; if(!f||!f.id) return;
    const cur=fById(f.id);
    if(!cur){ FOLDERS.push(f); n++; }
    else if((f.ts||0)>(cur.ts||0)){ Object.assign(cur,f); n++; } });
  if(n){ FOLDERS.sort((a,b)=>b.ts-a.ts);
    try{localStorage.setItem(LSF,JSON.stringify(FOLDERS));}catch(e){} }
  return n; }

function cancelTest(){ if(confirm('응시를 취소할까요?')){S.sheet=null;render();} }
function answered(){return S.sheet.qs.filter(q=>{const a=S.answers[q.seq];return a!==undefined&&String(a).trim()!=='';}).length;}
function submitTest(){
  const cfg=S.sheet.cfg, qs=S.sheet.qs, left=qs.length-answered();
  if(left>0&&!confirm('아직 '+left+'문항이 비어 있습니다. 제출할까요?')) return;
  const pt=ptsPlan(qs.length);
  let sc=0; const rows=[],cat={},lvl={상:[0,0],중:[0,0],하:[0,0]};
  qs.forEach((q,i)=>{
    const pts=pt(i), my=S.answers[q.seq];
    const ok=q.type==='mc'?my===q.answer:okShort(q,my);
    if(ok)sc+=pts;
    if(!cat[q.cat])cat[q.cat]=[0,0];
    cat[q.cat][1]++; if(ok)cat[q.cat][0]++;
    lvl[q.level][1]++; if(ok)lvl[q.level][0]++;
    rows.push({q:q,my:my,ok:ok,pts:pts});});
  S.report={score:sc,rows:rows,cat:cat,lvl:lvl,when:new Date(),cfg:cfg};
  const r=JSON.parse(localStorage.getItem('og.records')||'[]');
  r.unshift({name:TK.name,cls:TK.cls,title:cfg.title,grade:cfg.grade||'',
    date:new Date().toISOString().slice(0,16).replace('T',' '),
    score:sc,total:qs.length,right:rows.filter(x=>x.ok).length});
  localStorage.setItem('og.records',JSON.stringify(r.slice(0,400)));
  render();window.scrollTo({top:0,behavior:'smooth'});
}

/* 화면용 — 인쇄와 같은 A4 조판 + 편집 버튼 + 정답 */
function curSheets(it,isChk){
  const T=oTrack(), b=oBook();
  const kind=isChk?T.check:T.recall;
  const M=mmpx(), footH=15*M;
  const head=listHead(esc(T.vol)+' · '+esc(b.short),it.t,kind+(it.src?' · '+it.src:''));
  const blocks=curBlocks(it,isChk,{edit:1,key:1});
  if(!blocks.length) return '<p class="hint" style="padding:20px">문항이 없습니다.</p>';
  const hs=measureAll(blocks,COLW,6.5), H1=measureOne(head,FULLW);
  const pages=layoutCols(blocks.map((h,i)=>({html:h,h:hs[i]})),H1,H1,footH);
  return pages.map((pg,pi)=>'<div class="sheet">'+head+cols2(pg)+
    '<div class="exf"><b>ORUN GRAMMAR</b>&nbsp;· '+esc(T.vol)+' '+esc(kind)+
    '<span class="pg">'+(pi+1)+' / '+pages.length+'</span></div></div>').join('');
}

    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'+
    '<span style="background:var(--navy);color:#fff;border-radius:9px;padding:5px 12px;font-weight:800;font-size:12.5px">'+
    esc(sec.label||sec.kind)+'</span>'+
    '<span style="color:var(--sub);font-size:13px">'+esc(sec.instruction||'')+'</span></div>'+
    sec.rows.map((r,i)=>{const ek='c|'+S.bkT+'|'+it.id+'|rec|'+si+'|'+i;
      return '<div class="q'+(EDITS[ek]?' edited':'')+'" style="margin-bottom:7px"><div class="head">'+
      '<span class="num">'+String(i+1).padStart(2,'0')+'</span>'+
      '<div style="flex:1;min-width:0"><div class="stem">'+fmt(r.prompt||'')+'</div>'+
      '<div style="border-bottom:1px dashed var(--line);height:'+((r.lines||1)*20)+'px;margin-top:6px"></div></div>'+
      '<span class="tags">'+edBtn(ek,(sec.label||'')+' #'+(i+1))+'</span></div>'+
      '<div class="ans"><b>정답</b> '+fmt(r.answer||'')+'<div class="why">'+esc(r.why||'')+'</div></div></div>';}).join('')+
    '</div>').join('');
}
/* 옳은영어 커리큘럼 시험지 인쇄 */
/* 커리큘럼 문항 → 시험지 조판 블록 (화면·인쇄 공용) */
function curBlocks(it,isChk,o){
  o=o||{}; const out=[];
  if(isChk){
    const key={}; (it.chk.answerKey||[]).forEach(k=>{key[k.no]=k;});
    (it.chk.questions||[]).forEach(q=>{
      const ek='c|'+S.bkT+'|'+it.id+'|chk|'+q.no;
      let h='<div class="pq'+(o.edit&&EDITS[ek]?' edq':'')+'">';
      if(q.groupHeader) h+='<div class="pgh">'+fmt(q.groupHeader)+'</div>';
      h+='<div class="ph"><span class="pn">'+q.no+'</span>'+
        (o.edit?'<button class="pedit" onclick="event.stopPropagation();openEd(\''+ek+'\',\''+
          String(it.t||'').replace(/'/g,"\\'")+' #'+q.no+'\')">편집</button>':'')+'</div>';
      if(q.stem) h+='<div class="pask">'+fmt(q.stem)+'</div>';
      if(q.bank&&q.bank.length) h+='<div class="pbank"><b>보기</b> '+q.bank.map(fmt).join('&nbsp; &nbsp;')+'</div>';
      if(q.bullets&&q.bullets.length) h+='<div class="pbul">'+q.bullets.map(x=>'· '+fmt(x)).join('<br>')+'</div>';
      if(q.choices&&q.choices.length){ const long=q.choices.some(c=>c.length>16);
        h+='<ol class="'+(long?'':'two')+'">'+q.choices.map((c,i)=>'<li>'+CIRC[i]+' '+fmt(c)+'</li>').join('')+'</ol>'; }
      else h+='<div class="line"></div>';
      if(o.key){ const k=key[q.no]||{};
        h+='<div class="pkey"><b>정답</b> '+fmt(k.answer||'')+'<div class="pw">'+esc(k.why||'')+'</div></div>'; }
      out.push(h+'</div>');
    });
  } else {
    (it.rec.sections||[]).forEach((sec,si)=>{
      out.push('<div class="pq" style="margin-bottom:3mm"><div class="pgh sec">'+
        '<b>'+esc(sec.label||'')+'</b>'+esc(sec.instruction||'')+'</div></div>');
      (sec.rows||[]).forEach((r,i)=>{
        const ek='c|'+S.bkT+'|'+it.id+'|rec|'+si+'|'+i;
        let h='<div class="pq'+(o.edit&&EDITS[ek]?' edq':'')+'">'+
          '<div class="ph"><span class="pn">'+(i+1)+'</span>'+
          (o.edit?'<button class="pedit" onclick="event.stopPropagation();openEd(\''+ek+'\',\''+
            String(sec.label||'').replace(/'/g,"\\'")+' #'+(i+1)+'\')">편집</button>':'')+'</div>'+
          '<div class="pask">'+fmt(r.prompt||'')+'</div>'+
          '<div class="line" style="height:'+((r.lines||1)*13)+'px"></div>';
        if(o.key) h+='<div class="pkey"><b>정답</b> '+fmt(r.answer||'')+'<div class="pw">'+esc(r.why||'')+'</div></div>';
        out.push(h+'</div>');
      });
    });
  }
  return out;
}
function orunPaper(withKey){
  const T=oTrack(), b=oBook(), it=oItem(), isChk=S.bkTab==='chk';
  const kind=isChk?T.check:T.recall;
  const M=mmpx(), footH=15*M;
  const head1='<div class="exh">'+exLogo()+'<div class="lft"><div class="bar"></div><div>'+
    '<div class="t0">'+esc(T.vol)+' · '+esc(b.short)+'</div>'+
    '<div class="t1">'+esc(it.t)+'</div></div></div>'+
    '<div class="rgt"><b>'+esc(kind)+'</b>'+esc(it.src||'')+'</div></div>'+
    '<div class="exi"><div><span>학년/반</span><i></i></div><div><span>이름</span><i></i></div>'+
    '<div class="sc"><span>점수</span><i>&nbsp; &nbsp; / 100</i></div></div><div style="height:9px"></div>';
  const headN='<div class="exh">'+exLogo('sm')+'<div class="lft"><div class="bar"></div><div>'+
    '<div class="t0">'+esc(T.vol)+'</div><div class="t1" style="font-size:15px">'+esc(it.t)+'</div></div></div>'+
    '<div class="rgt"><b>'+esc(kind)+'</b>'+esc(b.short)+'</div></div><div style="height:9px"></div>';
  const blocks=curBlocks(it,isChk,{});
  const hs=measureAll(blocks,COLW,6.5);
  const H1=measureOne(head1,FULLW), HN=measureOne(headN,FULLW);
  const pages=layoutCols(blocks.map((h,i)=>({html:h,h:hs[i]})),H1,HN,footH);

  const keyHead=(cont)=>'<div class="keyh">'+exLogo()+'<div class="bar"></div><div>'+
    '<div class="t0">ANSWER &amp; EXPLANATION</div>'+
    '<div class="t1">'+esc(it.t)+' — '+esc(kind)+' 정답 및 해설'+(cont?' (이어서)':'')+'</div></div>'+
    '<div class="rgt"><b>'+esc(T.vol)+'</b>교사용</div></div>';
  const KTH='<tr><th style="width:24px">No</th><th style="width:170px">정답</th><th>해설</th></tr>';
  let keyPages=[];
  if(withKey){
    const rows=isChk
      ? (it.chk.answerKey||[]).map(k=>'<tr><td class="n">'+k.no+'</td><td class="a">'+fmt(k.answer||'')+
          '</td><td>'+esc(k.why||'')+'</td></tr>')
      : [].concat.apply([],(it.rec.sections||[]).map(sec=>
          ['<tr><td colspan="3" style="background:#f6f8fb;font-weight:800">'+esc(sec.label||'')+'</td></tr>']
          .concat(sec.rows.map((r,i)=>'<tr><td class="n">'+(i+1)+'</td><td class="a">'+
            fmt(r.answer||'')+'</td><td>'+esc(r.why||'')+'</td></tr>'))));
    const p=probe(FULLW); p.innerHTML='<table class="ktab">'+KTH+rows.join('')+'</table>';
    const trs=p.querySelector('table').rows, thH=trs[0].getBoundingClientRect().height, rh=[];
    for(let i=1;i<trs.length;i++) rh.push(trs[i].getBoundingClientRect().height);
    p.innerHTML='';
    const kh1=measureOne(keyHead(0),FULLW)+thH+2*M, khN=measureOne(keyHead(1),FULLW)+thH+2*M;
    keyPages=layoutRows(rows.map((h,i)=>({html:h,h:rh[i]||18})),kh1,khN,footH);
  }
  const tot=pages.length+keyPages.length;
  const foot=(p,lb)=>'<div class="exf"><b>ORUN GRAMMAR</b>&nbsp;· '+esc(lb)+'<span class="pg">'+p+' / '+tot+'</span></div>';
  let h='';
  pages.forEach((pg,pi)=>{ h+='<div class="sheet">'+(pi===0?head1:headN)+cols2(pg)+
    foot(pi+1,T.vol+' '+kind)+'</div>';});
  keyPages.forEach((rows,ki)=>{ h+='<div class="sheet">'+keyHead(ki>0)+
    '<table class="ktab">'+KTH+rows.join('')+'</table>'+foot(pages.length+ki+1,'정답 및 해설')+'</div>';});
  return h;
}
function printOrun(){document.getElementById('paper').innerHTML=orunPaper(S.bkKey);setTimeout(()=>window.print(),150);}
function docxOrun(){
  const T=oTrack(), b=oBook(), it=oItem(), isChk=S.bkTab==='chk';
  const kind=isChk?T.check:T.recall;
  const qs=[];
  if(isChk){
    const key={};(it.chk.answerKey||[]).forEach(k=>{key[k.no]=k;});
    it.chk.questions.forEach(q=>{
      let stem=(q.groupHeader?q.groupHeader+'\n':'')+(q.stem||'');
      if(q.bank&&q.bank.length) stem+='\n[보기] '+q.bank.join('   ');
      if(q.bullets&&q.bullets.length) stem+='\n'+q.bullets.map(x=>'· '+x).join('\n');
      const k=key[q.no]||{};
      qs.push({seq:q.no,level:'중',type:(q.choices&&q.choices.length)?'mc':'short',
        stem:stem.trim(),choices:q.choices&&q.choices.length?q.choices:null,
        answer:(q.choices&&q.choices.length)?Math.max(1,q.choices.indexOf(k.answer)+1):(k.answer||''),
        why:k.why||'',cat:it.t});
    });
  } else {
    let n=0;
    (it.rec.sections||[]).forEach(sec=>{sec.rows.forEach(r=>{n++;
      qs.push({seq:n,level:'중',type:'short',stem:'['+(sec.label||'')+'] '+(r.prompt||''),
        choices:null,answer:r.answer||'',why:r.why||'',cat:it.t});});});
  }
  const exam={cfg:{title:it.t+' — '+kind,grade:T.vol,book:b.short},qs:qs};
  try{ dl(docxBlob(exam,true),(b.short+'_'+it.t+'_'+kind).replace(/[\\/:*?"<>|]/g,'-')+'.docx');
       toast('Word 파일을 저장했습니다'); }
  catch(e){ toast('Word 생성 실패: '+e.message); }
}
