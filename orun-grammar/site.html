<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>옳은문법 ORUN GRAMMAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1220; --sub:#64748b; --sub2:#94a3b8;
  --line:#e6ebf2; --line2:#eef2f7;
  --navy:#0f1b2d; --gold:#f5b01b; --gold2:#c98d0a;
  --green:#10b981; --greenBg:#ecfdf5;
  --red:#e0524d; --redBg:#fdf0ef;
  --blue:#2f6df6; --blueBg:#eef4ff;
  --glass:rgba(255,255,255,.72); --glassLine:rgba(255,255,255,.85);
  --shadow:0 1px 2px rgba(15,27,45,.04),0 8px 28px rgba(15,27,45,.07);
  --shadow2:0 2px 6px rgba(15,27,45,.06),0 18px 48px rgba(15,27,45,.12);
  --r2:22px; --spring:cubic-bezier(.34,1.4,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{color:var(--ink);background:#f5f7fb;
  font-family:'Noto Sans KR','Noto Sans',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  font-size:14.5px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;letter-spacing:inherit}
#aura{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(1200px 700px at 10% -10%,#e8f0ff 0%,transparent 60%),
  radial-gradient(900px 600px at 100% 0%,#fff5e0 0%,transparent 55%),
  radial-gradient(1000px 800px at 50% 110%,#eafaf3 0%,transparent 60%),#f5f7fb}
#aura i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:float 22s var(--spring) infinite alternate}
#aura i:nth-child(1){width:460px;height:460px;background:#bcd4ff;left:-6%;top:-8%}
#aura i:nth-child(2){width:380px;height:380px;background:#ffe0a8;right:-4%;top:6%;animation-duration:27s}
#aura i:nth-child(3){width:420px;height:420px;background:#b9f0d8;left:38%;bottom:-14%;animation-duration:31s}
@keyframes float{to{transform:translate3d(60px,50px,0) scale(1.14)}}
@media (prefers-reduced-motion:reduce){#aura i{animation:none}}

header.top{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.72);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid rgba(230,235,242,.9)}
.hwrap{max-width:1340px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;flex:none;text-decoration:none;color:inherit;
  cursor:pointer;border-radius:14px;padding:3px 8px 3px 3px;margin-left:-3px;transition:.26s var(--spring)}
.brand:hover{background:rgba(31,95,224,.06)}
.brand:hover .mark{transform:scale(1.05) rotate(-3deg);box-shadow:0 6px 16px rgba(16,32,64,.16)}
.mark{transition:.3s var(--spring)}
.brand:active{transform:scale(.98)}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--navy),#243b5e);
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(15,27,45,.28)}
.mark svg{width:19px;height:19px}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand em{font-style:normal;color:var(--sub2);font-weight:600;font-size:10.5px;letter-spacing:.22em;display:block;margin-top:-3px}
nav.seg{margin-left:auto;display:flex;gap:2px;background:#eef1f6;padding:3px;border-radius:12px}
nav.seg button{border:0;background:none;color:var(--sub);padding:7px 15px;border-radius:9px;
  font-size:13.5px;font-weight:600;cursor:pointer;transition:.25s var(--spring);white-space:nowrap}
nav.seg button:hover{color:var(--ink)}
nav.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.12);font-weight:700}
.pro{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--sub);background:#eef1f6;border-radius:999px;padding:6px 13px}

main{max-width:1340px;margin:0 auto;padding:22px 22px 80px}
.layout{display:grid;grid-template-columns:246px 1fr;gap:18px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:1fr}}
.card{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glassLine);border-radius:var(--r2);box-shadow:var(--shadow);padding:18px}
.card.solid{background:#fff}
.ttl{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--sub);margin:0 0 12px}
.ttl svg{width:15px;height:15px;stroke:var(--sub2);fill:none;stroke-width:1.8}
.ttl .r{margin-left:auto;font-weight:600;color:var(--sub2);font-size:11.5px}

.side{position:sticky;top:74px;max-height:calc(100vh - 96px);overflow:auto}
.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:#dde3ec;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.grp{font-size:11px;font-weight:800;color:var(--sub2);letter-spacing:.14em;margin:14px 4px 7px}
.grp:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:#f4f6fa;
  border:1px solid transparent;cursor:pointer;transition:.22s var(--spring);margin-bottom:5px;font-size:13.5px;font-weight:600}
.row:hover{background:#eef2f8;transform:translateX(2px)}
.row .dot{width:7px;height:7px;border-radius:50%;background:#cbd5e1;flex:none;transition:.2s}
.row .n{margin-left:auto;font-size:11px;color:var(--sub2);font-weight:600}
.row.all{background:var(--blueBg)}
.row.on{background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(15,27,45,.24);transform:none}
.row.on .dot{background:var(--gold);box-shadow:0 0 0 3px rgba(245,176,27,.25)}
.row.on .n{color:rgba(255,255,255,.6)}
.gtabs{display:flex;gap:4px;background:#eef1f6;padding:3px;border-radius:11px;margin-bottom:12px}
.gtabs button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:.22s var(--spring)}
.gtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.12)}

.steps{display:flex;gap:10px;margin-bottom:16px}
.step{flex:1;display:flex;align-items:center;gap:11px;padding:13px 18px;border-radius:15px;background:#eef1f6;
  color:var(--sub);font-weight:700;font-size:13.5px;position:relative;overflow:hidden;transition:.3s var(--spring)}
.step b{width:23px;height:23px;border-radius:50%;background:#d8dfe9;color:#fff;display:grid;place-items:center;font-size:11.5px;flex:none;transition:.3s}
.step small{font-weight:500;color:var(--sub2);font-size:11.5px;margin-left:auto}
.step.on{background:linear-gradient(100deg,var(--navy),#28405f);color:#fff;box-shadow:0 8px 24px rgba(15,27,45,.26)}
.step.on b{background:var(--gold);color:var(--navy)}
.step.on small{color:rgba(255,255,255,.65)}
.step.on::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.22),transparent 70%);
  transform:translateX(-120%);animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.step.done{background:var(--greenBg);color:#0b7a56}.step.done b{background:var(--green)}

.mode{display:flex;gap:4px;background:#eef1f6;padding:3px;border-radius:11px;margin-bottom:12px;width:fit-content}
.mode button{border:0;background:none;padding:7px 16px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:.22s var(--spring)}
.mode button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.12)}
.tree{max-height:392px;overflow:auto;border:1px solid var(--line);border-radius:15px;background:#fff;padding:7px}
.tree::-webkit-scrollbar{width:9px}.tree::-webkit-scrollbar-thumb{background:#dde3ec;border-radius:9px;border:3px solid #fff}
.les{border-radius:12px;overflow:hidden;margin-bottom:4px}
.les>.h{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f6f8fb;cursor:pointer;font-weight:700;font-size:13px;transition:.2s}
.les>.h:hover{background:#eef2f8}
.les>.h .cv{transition:.3s var(--spring);color:var(--sub2);font-size:10px}
.les.op>.h .cv{transform:rotate(90deg)}
.les>.h .lb{color:var(--sub2);font-weight:500;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.les>.b{display:none;padding:5px 6px 8px}
.les.op>.b{display:block;animation:drop .3s var(--spring)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.it{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:10px;cursor:pointer;transition:.18s;font-size:13.5px}
.it:hover{background:#f6f8fb}
.it.sel{background:var(--blueBg)}
.chk{width:18px;height:18px;border-radius:6px;border:1.6px solid #cbd5e1;flex:none;display:grid;place-items:center;
  transition:.2s var(--spring);background:#fff}
.chk svg{width:11px;height:11px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0;transform:scale(.5);transition:.2s var(--spring)}
.it.sel .chk,.les.allsel>.h .chk{background:var(--navy);border-color:var(--navy)}
.it.sel .chk svg,.les.allsel>.h .chk svg{opacity:1;transform:none}
.it .gd{font-size:10px;font-weight:800;color:var(--sub2);background:#f1f5f9;border-radius:5px;padding:1px 6px;flex:none}
.it .qn{margin-left:auto;font-size:11px;color:var(--sub2);font-weight:600;flex:none}

.opt{display:grid;grid-template-columns:92px 1fr;gap:11px 14px;align-items:center}
.opt>label{font-size:12.5px;font-weight:700;color:var(--sub)}
.pills{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pill{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 13px;font-size:12.5px;font-weight:700;
  color:var(--sub);cursor:pointer;transition:.22s var(--spring)}
.pill:hover{border-color:#c3cede;transform:translateY(-1px)}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 5px 14px rgba(15,27,45,.22)}
.num{width:66px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px;font-weight:700;text-align:center;background:#fff}
.num:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,27,45,.08)}
.txt{border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:13.5px;background:#fff;width:100%;max-width:340px}
.txt:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,27,45,.08)}
.lvbox{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.lvchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:11px;padding:5px 5px 5px 12px;background:#fff}
.lvchip span{font-size:12.5px;font-weight:800}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.sw i{width:38px;height:22px;border-radius:999px;background:#dde3ec;position:relative;transition:.28s var(--spring);flex:none}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.28s var(--spring)}
.sw.on i{background:var(--green)}.sw.on i::after{transform:translateX(16px)}
.warn{font-size:12px;color:var(--red);font-weight:600}
.okmsg{font-size:12px;color:var(--green);font-weight:600}

.btn{position:relative;overflow:hidden;border:0;border-radius:13px;padding:12px 26px;font-size:14px;font-weight:700;
  cursor:pointer;transition:.25s var(--spring);background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(15,27,45,.24)}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(15,27,45,.3)}
.btn:active{transform:translateY(0) scale(.985)}
.btn:disabled{opacity:.4;box-shadow:none;transform:none;cursor:not-allowed}
.btn.gold{background:linear-gradient(140deg,#f7bb35,#e39a06);color:#3a2600;box-shadow:0 6px 18px rgba(227,154,6,.35)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.ghost:hover{border-color:#c3cede}
.btn.sm{padding:8px 16px;font-size:12.5px;border-radius:11px}
.btn .rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}
@keyframes rp{to{transform:scale(3.2);opacity:0}}
.keybtn{border:1.6px solid var(--red);color:var(--red);background:#fff;border-radius:11px;padding:8px 17px;
  font-weight:800;font-size:13px;cursor:pointer;transition:.22s var(--spring)}
.keybtn:hover{background:var(--redBg)}
.keybtn.on{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(224,82,77,.3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:13px}
.cat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 17px;cursor:pointer;
  transition:.28s var(--spring);position:relative;overflow:hidden;animation:pop .45s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.cat::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--gold),#f7d27a);transform:scaleX(0);transform-origin:left;transition:.35s var(--spring)}
.cat:hover{transform:translateY(-4px);box-shadow:var(--shadow2);border-color:#dbe3ee}
.cat:hover::before{transform:none}
.cat .no{position:absolute;top:15px;right:16px;color:#dae1eb;font-weight:900;font-size:13px}
.cat b{display:block;font-size:14.5px;font-weight:700;margin-bottom:6px;padding-right:34px;line-height:1.35}
.cat .pts{color:var(--sub);font-size:12px;min-height:32px;line-height:1.5}
.cat .meta{display:flex;gap:5px;margin-top:11px;font-size:10.5px;font-weight:800}
.cat .meta i{font-style:normal;border-radius:6px;padding:3px 8px;background:#f1f5f9;color:var(--sub)}
.cat .meta i.g{background:#fff7e6;color:var(--gold2)}
.cat .meta i.b{background:var(--blueBg);color:#2450b8}

.tools{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:12px 0 15px}
.crumb{color:var(--sub);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;transition:.2s}
.crumb:hover{color:var(--ink);transform:translateX(-2px)}
.q{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 18px;margin-bottom:9px;transition:.24s var(--spring)}
.q:hover{border-color:#dbe3ee;box-shadow:var(--shadow)}
.q .head{display:flex;gap:11px;align-items:flex-start}
.q .num{font-weight:800;color:var(--navy);min-width:26px;font-size:13.5px;padding-top:1px}
.q .stem{white-space:pre-wrap;line-height:1.72}
.q ol.ch{list-style:none;margin:9px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 20px}
.q ol.ch li{font-size:14px;line-height:1.7}
.tags{display:flex;gap:4px;flex:none;margin-left:auto}
.tag{font-size:10px;font-weight:800;border-radius:6px;padding:3px 7px;background:#f1f5f9;color:var(--sub)}
.tag.lv하{background:var(--greenBg);color:#0b7a56}.tag.lv중{background:#fff7e6;color:var(--gold2)}.tag.lv상{background:var(--redBg);color:#b8332e}
.q .ans{display:none;margin-top:11px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
.showkey .q .ans{display:block;animation:drop .3s var(--spring)}
.q .ans b{color:var(--red);font-weight:800}
.q .ans .why{color:var(--sub);margin-top:3px;line-height:1.65}
u{text-underline-offset:3.5px;text-decoration-thickness:1.4px}

.tq{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 20px;margin-bottom:11px;transition:.24s}
.tq:hover{box-shadow:var(--shadow)}
.tq .opts{display:grid;gap:6px;margin-top:10px}
.tq .opts label{display:flex;gap:10px;align-items:flex-start;padding:9px 13px;border:1px solid var(--line);
  border-radius:11px;cursor:pointer;font-size:14px;transition:.2s var(--spring);background:#fff}
.tq .opts label:hover{background:#f6f8fb;border-color:#cfd9e6}
.tq .opts label.sel{border-color:var(--navy);background:#f3f6fb;font-weight:600;box-shadow:0 0 0 2px rgba(15,27,45,.06)}
.tq .opts input{margin-top:4px;accent-color:var(--navy)}
.shorta{width:100%;max-width:440px;border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-size:14px;margin-top:10px}
.shorta:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,27,45,.08)}
.sticky{position:sticky;bottom:14px;margin-top:18px;background:rgba(255,255,255,.82);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glassLine);border-radius:17px;box-shadow:var(--shadow2);padding:12px 18px;
  display:flex;align-items:center;gap:14px;z-index:20;flex-wrap:wrap}
.prog{flex:1;height:7px;background:#eef1f6;border-radius:999px;overflow:hidden;max-width:280px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f7d27a);border-radius:999px;transition:.4s var(--spring)}

.score{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:#eef1f6}
.ring .fg{stroke:url(#gr);transition:stroke-dashoffset 1.1s var(--spring)}
.ring .lab{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lab b{font-size:31px;font-weight:800;line-height:1;letter-spacing:-.03em}
.ring .lab span{font-size:10.5px;color:var(--sub2);font-weight:700}
.bar{display:grid;grid-template-columns:186px 1fr 84px;gap:12px;align-items:center;margin-bottom:8px;font-size:13px}
.bar .tr{background:#eef1f6;border-radius:999px;height:9px;overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(90deg,var(--navy),#3a5580);border-radius:999px;width:0;transition:width .9s var(--spring)}
.bar.weak .fl{background:linear-gradient(90deg,#e0524d,#f08b87)}
.bar .pc{text-align:right;color:var(--sub);font-weight:700;font-size:12px}
table.rep{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;margin-top:9px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}
table.rep th,table.rep td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
table.rep tr:last-child td{border-bottom:0}
table.rep th{background:#f6f8fb;color:var(--sub);font-weight:700;font-size:12px}
td.ok{color:var(--green);font-weight:900;text-align:center}td.no{color:var(--red);font-weight:900;text-align:center}
.advice{background:linear-gradient(120deg,#fffaf0,#fff5e3);border:1px solid #f6e3b8;border-radius:15px;padding:14px 18px;margin-top:14px;font-size:13px}
.codebox{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#f6f8fb;border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;word-break:break-all;user-select:all;line-height:1.6}
.hint{color:var(--sub);font-size:12.5px}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat>div{flex:1;min-width:132px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 17px}
.stat b{display:block;font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.stat span{font-size:11.5px;color:var(--sub);font-weight:600}

#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,26px);z-index:200;opacity:0;pointer-events:none;
  background:rgba(15,27,45,.94);color:#fff;padding:12px 22px;border-radius:14px;font-size:13.5px;font-weight:600;
  box-shadow:0 12px 34px rgba(15,27,45,.35);transition:.36s var(--spring)}
#toast.on{opacity:1;transform:translate(-50%,0)}


/* ═══════════════════════════════════════════════════════════
   ORUN STUDIO — 라이트 글래스모피즘 (전문 저작 도구 톤)
   화면 전용. 시험지(.sheet) 조판에는 적용되지 않는다.
   ═══════════════════════════════════════════════════════════ */
:root{
  --ink:#0e1726; --sub:#5b6b85; --sub2:#93a1b6;
  --line:#e4eaf2; --line2:#eef3f9;
  --navy:#1f5fe0; --acc:#1f5fe0; --acc2:#3b82f6; --accSoft:#eaf1ff;
  --gold:#f0a81b; --gold2:#b8820b;
  --green:#0ea36f; --greenBg:#e9f9f2;
  --red:#e0524d;   --redBg:#fdf0ef;
  --blue:#1f5fe0;  --blueBg:#eaf1ff;
  --glass:rgba(255,255,255,.74); --glassLine:rgba(255,255,255,.92);
  --pnl:rgba(255,255,255,.72);
  --shadow:0 1px 1px rgba(16,32,64,.03),0 8px 24px rgba(16,32,64,.06);
  --shadow2:0 2px 4px rgba(16,32,64,.04),0 20px 52px rgba(16,32,64,.11);
  --mono:'Noto Sans Mono','Noto Sans',ui-monospace,SFMono-Regular,Menlo,monospace;
}
body{background:#f3f6fb;color:var(--ink)}
::selection{background:rgba(31,95,224,.16)}
#aura,#sky{display:none!important}
#glow{position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(900px 560px at 8% -6%,rgba(31,95,224,.10),transparent 62%),
  radial-gradient(760px 520px at 96% 0%,rgba(120,170,255,.12),transparent 58%),
  radial-gradient(1100px 700px at 50% 112%,rgba(31,95,224,.06),transparent 64%),
  linear-gradient(180deg,#f7fafe,#f3f6fb 42%)}
#grid{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.7;
  background-image:linear-gradient(rgba(16,40,90,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(16,40,90,.028) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 88% 62% at 50% 22%,#000 30%,transparent 100%);
          mask-image:radial-gradient(ellipse 88% 62% at 50% 22%,#000 30%,transparent 100%)}

/* ── 헤더 ── */
header.top{background:rgba(255,255,255,.74);border-bottom:1px solid rgba(228,234,242,.9);
  backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%)}
.hwrap{gap:14px}
.mark{background:#fff;border:1px solid var(--line);box-shadow:0 3px 10px rgba(16,32,64,.1);overflow:hidden}
.mark img{width:82%;height:82%;object-fit:contain;display:block}
.mark svg{stroke:var(--acc)}
.brand b{color:var(--ink)}
.brand em{color:var(--acc);font-family:var(--mono);letter-spacing:.26em;font-size:9.5px;font-weight:600}
nav.seg{margin:0 auto;background:rgba(255,255,255,.72);padding:4px;border-radius:999px;
  border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,32,64,.04)}
nav.seg button{border-radius:999px;padding:7px 17px;color:var(--sub);font-size:13px;
  display:inline-flex;align-items:center;gap:7px}
nav.seg button::before{content:'';width:5px;height:5px;border-radius:50%;background:#cfd8e6;transition:.25s var(--spring)}
nav.seg button:hover{color:var(--ink);background:rgba(31,95,224,.05)}
nav.seg button.on{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(14,23,38,.24)}
nav.seg button.on::before{background:var(--gold)}
.pro{background:var(--accSoft);border:1px solid #d5e3ff;color:var(--acc);font-family:var(--mono)}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.05em;color:var(--sub);background:rgba(255,255,255,.8);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;cursor:pointer;transition:.22s var(--spring);white-space:nowrap}
.chip:hover{border-color:#b9cdf5;color:var(--ink)}
.chip i{width:6px;height:6px;border-radius:50%;background:#c7d2e0;flex:none}
.chip.ok i{background:var(--green);box-shadow:0 0 0 3px rgba(14,163,111,.16)}
.chip.busy i{background:var(--gold);animation:bl .8s linear infinite}
.chip.err i{background:var(--red);box-shadow:0 0 0 3px rgba(224,82,77,.16)}
@keyframes bl{50%{opacity:.2}}
@media (max-width:1120px){.chip .cx{display:none}}

/* ── 페이지 머리글 (WORKBOOK STUDIO 톤) ── */
.phead{display:flex;align-items:flex-start;gap:17px;margin:2px 0 20px;padding-bottom:19px;
  border-bottom:1px solid var(--line)}
.phead .pico{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(150deg,#2f7dff,#1546b8);box-shadow:0 10px 24px rgba(31,95,224,.3)}
.phead .pico svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.phead .ptx{flex:1;min-width:0}
.phead .eb{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.28em;color:var(--acc);margin-bottom:3px}
.phead h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.16;color:var(--ink)}
.phead p{margin:5px 0 0;color:var(--sub);font-size:13px;max-width:820px}
.lbl{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.24em;color:var(--sub2);text-transform:uppercase}

/* ── 패널 ── */
.card{background:var(--glass);border:1px solid var(--glassLine);box-shadow:var(--shadow);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%)}
.card.solid{background:rgba(255,255,255,.82)}
.ttl{color:var(--sub);font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
.ttl svg{stroke:var(--acc)}
.ttl .r{font-family:'Noto Sans KR',sans-serif;letter-spacing:normal;text-transform:none;font-size:11.5px;color:var(--sub2)}
.grp{color:var(--acc);font-family:var(--mono);letter-spacing:.22em}

/* ── 좌측 레일 ── */
.side{counter-reset:rail}
.row{background:rgba(255,255,255,.66);border:1px solid var(--line);color:var(--ink);
  counter-increment:rail;padding-left:11px}
.row::before{content:counter(rail,decimal-leading-zero);font-family:var(--mono);font-size:9.5px;font-weight:700;
  color:var(--sub2);flex:none;width:16px}
.row:hover{background:#fff;border-color:#cfdcf3;box-shadow:0 4px 12px rgba(16,32,64,.06)}
.row .dot{background:#cbd5e1}
.row.all{background:linear-gradient(100deg,rgba(240,168,27,.2),rgba(240,168,27,.06) 70%);
  border-color:rgba(240,168,27,.42);color:#6d4a04;font-weight:800;position:relative;overflow:hidden}
.row.all::after{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,#ffc95c,var(--gold))}
.row.all::before{color:#b8860b}
.row.all .dot{background:var(--gold);box-shadow:0 0 0 3px rgba(240,168,27,.22)}
.row.all .n{color:#a8760a}
.row.all:hover{background:linear-gradient(100deg,rgba(240,168,27,.3),rgba(240,168,27,.1) 70%);
  border-color:rgba(240,168,27,.6);box-shadow:0 6px 16px rgba(240,168,27,.2)}
.row.all.on{background:linear-gradient(120deg,#2a2011,var(--ink) 55%,#1d2536);color:#fff;
  border-color:transparent}
.row.all.on::after{background:linear-gradient(180deg,#ffd884,var(--gold));
  box-shadow:0 0 10px rgba(240,168,27,.8)}
.row.all.on::before{color:rgba(255,201,92,.85)}
.row.all.on .n{color:rgba(255,255,255,.62)}
.grp{color:var(--sub2)}
.side .grp:first-child,.side .grp:nth-child(2){color:var(--sub2)}
.row.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 8px 22px rgba(14,23,38,.24)}
.row.on::before{color:rgba(255,255,255,.5)}
.row.on .dot{background:var(--gold);box-shadow:0 0 0 3px rgba(240,168,27,.28)}
.row.on .n{color:rgba(255,255,255,.6)}
.side::-webkit-scrollbar-thumb{background:#d6dee9}

/* ── 탭 · 스텝 ── */
.gtabs,.mode{background:rgba(255,255,255,.7);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,32,64,.04)}
.gtabs button,.mode button{color:var(--sub);border-radius:999px}
.gtabs{border-radius:999px;padding:4px}
.gtabs button.on,.mode button.on{background:#fff;color:var(--ink);
  box-shadow:0 2px 8px rgba(16,32,64,.12);font-weight:800}
.steps{gap:12px}
.step{background:rgba(255,255,255,.66);border:1px solid var(--line);color:var(--sub);border-radius:17px;
  box-shadow:0 1px 2px rgba(16,32,64,.03)}
.step b{background:#dbe3ee;color:#fff}
.step small{color:var(--sub2)}
.step.on{background:linear-gradient(102deg,var(--ink),#22334d);color:#fff;border-color:transparent;
  box-shadow:0 12px 30px rgba(14,23,38,.24)}
.step.on b{background:var(--gold);color:#3a2600}
.step.on small{color:rgba(255,255,255,.66)}
.step.done{background:var(--greenBg);border-color:#c8ecdd;color:#0b7a56}
.step.done b{background:var(--green)}

/* ── 트리 ── */
.tree{background:rgba(255,255,255,.75);border-color:var(--line)}
.tree::-webkit-scrollbar-thumb{background:#dde3ec;border-color:transparent}
.les>.h{background:#f4f7fc}
.les>.h:hover{background:#eaf1fb}
.it:hover{background:#f4f7fc}
.it.sel{background:var(--accSoft)}
.chk{background:#fff;border-color:#cbd5e1}
.it.sel .chk,.les.allsel>.h .chk{background:var(--acc);border-color:var(--acc)}

/* ── 폼 ── */
.pill{background:#fff;border-color:var(--line);color:var(--sub);border-radius:999px}
.pill:hover{border-color:#b9cdf5;color:var(--acc);background:var(--accSoft)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 5px 14px rgba(14,23,38,.22)}
.num,.txt,.shorta,.edin{background:#fff;border-color:var(--line);color:var(--ink)}
.num:focus,.txt:focus,.shorta:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(31,95,224,.12)}
.lvchip{background:#fff;border-color:var(--line);border-radius:999px}
.sw i{background:#dde3ec}
.hint{color:var(--sub2)}

/* ── 버튼 ── */
.btn{background:var(--ink);color:#fff;border-radius:999px;box-shadow:0 6px 18px rgba(14,23,38,.2)}
.btn:hover{box-shadow:0 10px 26px rgba(14,23,38,.28)}
.btn.gold{background:linear-gradient(140deg,#fbbf3c,#ee9f10);color:#3a2600;box-shadow:0 6px 18px rgba(238,159,16,.34)}
.btn.ghost{background:rgba(255,255,255,.86);color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,32,64,.05)}
.btn.ghost:hover{border-color:#b9cdf5;color:var(--acc);background:#fff;box-shadow:0 6px 16px rgba(31,95,224,.12)}
.keybtn{background:#fff;border-color:#f0c3c1;color:var(--red);border-radius:999px}
.keybtn:hover{background:var(--redBg)}
.keybtn.on{background:var(--red);color:#fff;border-color:var(--red)}

/* ── 액션 바(Step 2) ── */
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px;border-radius:18px;
  background:rgba(255,255,255,.6);border:1px solid var(--glassLine);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 22px rgba(16,32,64,.07)}
.acts .sp{margin-left:auto}

/* ── 통계 타일 ── */
.stat{gap:12px}
.stat>div{background:rgba(255,255,255,.78);border:1px solid var(--glassLine);border-radius:18px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%)}
.stat>div span::before{content:'';display:inline-block;width:6px;height:6px;border-radius:2px;
  margin-right:7px;vertical-align:1px;background:var(--acc)}
.stat>div:nth-child(2) span::before{background:var(--acc2)}
.stat>div:nth-child(3) span::before{background:var(--gold)}
.stat>div:nth-child(4) span::before{background:var(--green)}
.stat>div:nth-child(5) span::before{background:var(--sub2)}
.stat b{color:var(--ink);padding-top:4px}
.stat span{color:var(--sub2);font-family:var(--mono);font-size:9.5px;letter-spacing:.12em}

/* ── 카드 그리드 ── */
.cat{background:rgba(255,255,255,.8);border:1px solid var(--glassLine);box-shadow:var(--shadow)}
.cat::before{background:linear-gradient(90deg,var(--acc),#8fb6ff)}
.cat:hover{border-color:#c9dbff;box-shadow:var(--shadow2)}
.cat .no{color:#d4dceb;font-family:var(--mono)}
.cat .meta i{background:#f1f5fa;color:var(--sub);font-family:var(--mono);letter-spacing:.02em}
.cat .meta i.g{background:#fff6e3;color:var(--gold2)}
.cat .meta i.b{background:var(--accSoft);color:var(--acc)}

/* ── 문항 ── */
.q{background:rgba(255,255,255,.82);border:1px solid var(--glassLine);box-shadow:0 1px 2px rgba(16,32,64,.03);position:relative}
.q:hover{border-color:#cfdcf3;box-shadow:var(--shadow)}
.q .num{color:var(--acc);font-family:var(--mono);background:var(--accSoft);border-color:#dbe7ff}
.tag{background:#f1f5fa;color:var(--sub)}
.q .ans b{color:var(--red)}
.q.edited{border-color:#b3e6d1;background:rgba(233,249,242,.75)}
.q.edited::after{content:'수정됨';position:absolute;top:-1px;right:-1px;background:var(--green);color:#fff;
  font-size:9.5px;font-weight:800;padding:2px 9px;border-radius:0 15px 0 11px}
.edb{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
  padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;transition:.2s var(--spring);flex:none;
  font-family:var(--mono);letter-spacing:.04em}
.edb:hover{border-color:#b9cdf5;color:var(--acc);background:var(--accSoft)}
.edb.rv{border-color:#b3e6d1;color:var(--green);background:var(--greenBg)}

/* ── 응시 · 리포트 ── */
.tq{background:rgba(255,255,255,.85);border:1px solid var(--glassLine);box-shadow:var(--shadow)}
.tq .opts label{background:#fff;border-color:var(--line);border-radius:13px}
.tq .opts label:hover{background:#f6f9fd;border-color:#cfdcf3}
.tq .opts label.sel{border-color:var(--acc);background:var(--accSoft);box-shadow:0 0 0 2px rgba(31,95,224,.1)}
.tq .opts input{accent-color:var(--acc)}
.sticky{background:rgba(255,255,255,.84);border:1px solid var(--glassLine);box-shadow:var(--shadow2)}
.prog i{background:linear-gradient(90deg,var(--acc),#8fb6ff)}
.ring .bg{stroke:#eaeff6}
.bar .fl{background:linear-gradient(90deg,var(--acc),#7ba8ff)}
table.rep{background:rgba(255,255,255,.85);border-color:var(--line)}
table.rep th{background:#f5f8fc;color:var(--sub)}
.advice{background:linear-gradient(120deg,#fffaf0,#fff5e3);border:1px solid #f6e3b8}
.codebox{background:#f5f8fc;border-color:var(--line);color:var(--acc);font-family:var(--mono)}
#toast{background:rgba(14,23,38,.94);box-shadow:0 14px 36px rgba(14,23,38,.32)}
.pvwrap{background:#eef1f6;border:1px solid var(--line);border-radius:18px;padding:14px;max-height:none;overflow:visible}
#pv{overflow:hidden}
#pv .sheet{box-shadow:0 10px 34px rgba(16,32,64,.14)}

/* ── 편집 모달 ── */
#modal{position:fixed;inset:0;z-index:300;display:none;align-items:flex-start;justify-content:center;
  background:rgba(14,23,38,.34);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:32px 16px;overflow:auto}
#modal.on{display:flex;animation:fadein .22s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.mbox{width:100%;max-width:760px;background:rgba(255,255,255,.96);border:1px solid var(--glassLine);border-radius:24px;
  box-shadow:0 36px 90px rgba(14,23,38,.28);padding:24px 26px 20px;animation:mup .3s var(--spring);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
@keyframes mup{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.mbox h3{margin:0 0 3px;font-size:19px;font-weight:800;letter-spacing:-.02em}
.mbox .msub{color:var(--sub2);font-size:11.5px;font-family:var(--mono);letter-spacing:.06em;margin-bottom:16px;word-break:break-all}
.fld{margin-bottom:13px}
.fld>label{display:block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.18em;
  color:var(--sub2);text-transform:uppercase;margin-bottom:6px}
.edin{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:13.5px;
  background:#fff;color:var(--ink);line-height:1.65;resize:vertical;font-family:inherit}
.edin:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(31,95,224,.12)}
select.edin{appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--sub2) 50%),linear-gradient(135deg,var(--sub2) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.crow{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.pick{width:25px;height:25px;border-radius:50%;border:1.6px solid var(--line);background:#fff;
  color:var(--sub2);font-size:11px;font-weight:800;flex:none;cursor:pointer;display:grid;place-items:center;
  transition:.2s var(--spring)}
.pick:hover{border-color:var(--acc);color:var(--acc)}
.pick.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(31,95,224,.36)}
.mact{display:flex;gap:8px;align-items:center;margin-top:18px;padding-top:15px;border-top:1px solid var(--line);flex-wrap:wrap}
.mact .sp{margin-left:auto}
@media (max-width:900px){.phead h1{font-size:22px}.phead .pico{width:44px;height:44px}
  nav.seg{margin-left:0;order:3;width:100%;justify-content:center;overflow:auto}}


/* ── 발문 · 본문 상자(화면) ── */
.q .ask,.tq .ask{line-height:1.72;white-space:pre-wrap}
.sbox{margin-top:9px;border:1px solid var(--line);background:#f7fafd;border-radius:12px;padding:10px 14px}
.sbox .bl{display:flex;gap:8px;line-height:1.72;margin:2px 0}
.sbox .bl:first-child{margin-top:0}.sbox .bl:last-child{margin-bottom:0}
.sbox .bl .mk{flex:none;font-weight:800;color:var(--acc);font-family:var(--mono);font-size:12.5px;padding-top:1px}
.sbox .bl .tx{flex:1;min-width:0}
.sbox .bl.ko .tx{color:var(--sub);font-size:12.8px}
.sbox.one .bl{display:block}

/* ── 커리큘럼 트랙 스위치(초등·중등) ── */
.trk{display:flex;justify-content:center;margin:0 0 26px}
.trkin{display:flex;gap:6px;padding:6px;border-radius:999px;position:relative;
  background:rgba(255,255,255,.72);border:1px solid var(--glassLine);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 14px 34px rgba(16,32,64,.1)}
.trkb{position:relative;z-index:1;border:0;cursor:pointer;background:none;color:var(--sub);
  border-radius:999px;padding:13px 30px;display:flex;align-items:center;gap:12px;
  transition:.32s var(--spring);white-space:nowrap;font-family:inherit}
.trkb .ic{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:#eef3fa;color:var(--sub);transition:.32s var(--spring)}
.trkb .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.trkb .tx{text-align:left;line-height:1.2}
.trkb .tx b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.trkb .tx span{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.22em;opacity:.65}
.trkb .cnt{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:#eef3fa;color:var(--sub2);transition:.32s var(--spring)}
.trkb:hover{color:var(--ink);background:rgba(31,95,224,.05)}
.trkb:hover .ic{background:var(--accSoft);color:var(--acc)}
.trkb.on{color:#fff;background:linear-gradient(120deg,var(--ink),#22334d);
  box-shadow:0 12px 30px rgba(14,23,38,.24)}
.trkb.on .ic{background:var(--gold);color:#3a2600}
.trkb.on .cnt{background:rgba(255,255,255,.18);color:#fff}
@media (max-width:640px){.trkb{padding:11px 16px}.trkb .tx b{font-size:13px}.trkb .cnt{display:none}}

/* ── 선택 상태 이펙트 ── */
.chk{position:relative;background:linear-gradient(180deg,#fff,#f7f9fc);border:1.5px solid #cdd7e5;

.it{transition:.26s var(--spring)}

  box-shadow:0 3px 7px rgba(16,32,64,.05),0 26px 52px rgba(16,32,64,.15)}

.cat.g중1 .gi{background:linear-gradient(160deg,#e9f1ff,#d3e3ff);color:#1f5fe0;box-shadow:inset 0 1px 0 #fff,0 4px 10px rgba(31,95,224,.2)}
.cat.g중2 .gi{background:linear-gradient(160deg,#e6faf3,#cdf2e5);color:#0b7a56;box-shadow:inset 0 1px 0 #fff,0 4px 10px rgba(14,163,111,.18)}
.cat.g중3 .gi{background:linear-gradient(160deg,#f1ecfe,#e2d8fd);color:#6b46d6;box-shadow:inset 0 1px 0 #fff,0 4px 10px rgba(107,70,214,.18)}
.cat.g고등 .gi{background:linear-gradient(160deg,#fff5e0,#ffe9bd);color:#a8760a;box-shadow:inset 0 1px 0 #fff,0 4px 10px rgba(240,168,27,.24)}
.cat:hover .gi{transform:scale(1.06) rotate(-2deg)}
.cat .cbd{flex:1;min-width:0}
.cat b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.03em;line-height:1.34;

.cat .no{position:static;flex:none;align-self:flex-start;font-family:var(--mono);font-size:10px;font-weight:800;
  color:var(--sub2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:#fff;
  letter-spacing:.02em;transition:.3s}
.cat:hover .no{border-color:rgba(31,95,224,.3);color:var(--acc);background:var(--accSoft)}

.cat .cft{position:relative;z-index:1;display:flex;align-items:center;gap:6px;margin-top:auto;
  padding:11px 14px 13px 16px;border-top:1px solid var(--line2)}
.cat .mp{font-size:10px;font-weight:800;letter-spacing:0;border-radius:999px;padding:4px 9px;
  background:#f2f5fa;color:var(--sub);font-family:var(--mono)}
.cat .mp.b{background:var(--accSoft);color:var(--acc)}
.cat .mp.g{background:#fff5e2;color:#a8760a}
.cat .go{margin-left:auto;flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:#f2f5fa;color:var(--sub2);font-size:13px;font-weight:800;transition:.32s var(--spring)}
.cat:hover .go{background:linear-gradient(160deg,#243149,var(--ink));color:#fff;
  box-shadow:0 6px 16px rgba(14,23,38,.3);transform:translateX(2px)}

/* 교재 카드도 같은 결로 */
.bk{background:linear-gradient(180deg,#fff,#fcfdff);border:1px solid rgba(16,32,64,.07);border-radius:22px;
  box-shadow:0 1px 2px rgba(16,32,64,.04),0 10px 26px rgba(16,32,64,.07)}
.bk:hover{border-color:rgba(31,95,224,.24);box-shadow:0 3px 7px rgba(16,32,64,.05),0 26px 52px rgba(16,32,64,.15)}
.bkb .no{border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:#fff;color:var(--sub2);
  font-size:10px;top:-2px;right:-2px}
.bk:hover .bkb .no{border-color:rgba(31,95,224,.3);color:var(--acc);background:var(--accSoft)}
.bkb .meta{border-top:1px solid var(--line2);margin-top:12px;padding-top:11px;align-items:center}
.bkb .go{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:#f2f5fa;color:var(--sub2);font-size:12px;font-weight:800;transition:.32s var(--spring)}
.bk:hover .bkb .go{background:linear-gradient(160deg,#243149,var(--ink));color:#fff;
  box-shadow:0 6px 16px rgba(14,23,38,.3);transform:translateX(2px)}


/* ── 선택 항목 트레이 ── */
.seltray{margin-top:12px;border:1px solid rgba(31,95,224,.18);border-radius:16px;padding:12px 13px 11px;
  background:linear-gradient(180deg,rgba(234,241,255,.72),rgba(255,255,255,.7));
  backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 18px rgba(31,95,224,.08);
  animation:drop .3s var(--spring)}
.seltray .sh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.seltray .sh b{font-size:11.5px;font-weight:800;color:var(--acc);letter-spacing:-.01em}
.seltray .sh .c{font-family:var(--mono);font-size:10px;font-weight:800;color:#fff;background:var(--acc);
  border-radius:999px;padding:2px 8px;box-shadow:0 3px 8px rgba(31,95,224,.32)}
.seltray .sh .x{margin-left:auto;font-size:11px;font-weight:700;color:var(--sub2);cursor:pointer;
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;transition:.22s var(--spring)}
.seltray .sh .x:hover{color:var(--red);border-color:#f0c3c1;background:var(--redBg)}
.selwrap{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow:auto}
.selwrap::-webkit-scrollbar{width:7px}.selwrap::-webkit-scrollbar-thumb{background:#c8d7f0;border-radius:7px}
.selchip{display:inline-flex;align-items:center;gap:7px;height:29px;padding:0 5px 0 9px;border-radius:999px;
  background:#fff;border:1px solid rgba(31,95,224,.22);font-size:12px;font-weight:700;color:#16326a;
  box-shadow:0 1px 2px rgba(16,32,64,.05);transition:.24s var(--spring);animation:pop .28s var(--spring) both}
.selchip:hover{border-color:rgba(31,95,224,.45);box-shadow:0 5px 14px rgba(31,95,224,.16);transform:translateY(-1px)}
.selchip em{font-style:normal;font-family:var(--mono);font-size:9px;font-weight:800;color:var(--acc);
  background:var(--accSoft);border-radius:999px;padding:2px 6px}
.selchip i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--sub2);font-weight:700}
.selchip button{width:19px;height:19px;flex:none;border:0;border-radius:50%;cursor:pointer;
  background:#eef2f8;color:var(--sub2);font-size:11px;line-height:1;display:grid;place-items:center;
  transition:.2s var(--spring);font-family:inherit}
.selchip button:hover{background:var(--red);color:#fff;transform:rotate(90deg)}
.row .selc{flex:none;font-family:var(--mono);font-size:9.5px;font-weight:800;color:#fff;
  background:linear-gradient(160deg,#4b8bff,var(--acc));border-radius:999px;padding:2px 7px;
  box-shadow:0 2px 6px rgba(31,95,224,.35)}
.row.on .selc{background:var(--gold);color:#3a2600;box-shadow:none}


/* ── Step 2 요약 바 ── */
.sumbar{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;margin:0 0 13px;border-radius:16px;overflow:hidden;
  border:1px solid rgba(255,255,255,.9);
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(246,249,253,.7));
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,1),0 1px 2px rgba(16,32,64,.05),0 8px 20px rgba(16,32,64,.06)}
.sumbar .su{flex:1;min-width:96px;display:flex;flex-direction:column;justify-content:center;gap:1px;
  padding:11px 16px;border-left:1px solid var(--line2)}
.sumbar .su:first-child{border-left:0}
.sumbar .su b{font-size:19px;font-weight:800;letter-spacing:-.04em;line-height:1.2;color:var(--ink)}
.sumbar .su span{font-size:10.5px;font-weight:600;color:var(--sub2);letter-spacing:0}
.sumbar .su.lv b{display:flex;gap:5px}
.sumbar .su.lv i{font-style:normal;font-size:12px;font-weight:800;border-radius:7px;padding:2px 8px;line-height:1.5}
.sumbar .su.lv i.a{background:rgba(224,82,77,.13);color:#c0413c}
.sumbar .su.lv i.b{background:rgba(240,168,27,.16);color:#a8760a}

@media (max-width:760px){.sumbar .su{min-width:50%;border-top:1px solid var(--line2)}}


/* ═══ 풀블리드 · 헤더 컬러 · 선택 이펙트 · 폴더 · 랜딩 ═══ */
.hwrap{max-width:none;padding:10px 30px}
main{max-width:none;padding:0 30px 40px}

/* 상단 헤더 — 옅은 블루 그라데이션 */
header.top{background:linear-gradient(180deg,rgba(233,241,255,.92),rgba(246,250,255,.86));
  border-bottom:1px solid rgba(31,95,224,.14);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 6px 20px rgba(16,32,64,.05)}

/* 페이지 헤더 밴드 — 전체 폭 */
.phead{margin:0 -30px 22px;padding:24px 30px 20px;border-bottom:1px solid rgba(31,95,224,.14);

  position:relative}
.phead::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;

@media (max-width:760px){.phead{margin:0 -16px 18px;padding:18px 16px 16px}}

/* 상단 메뉴 선택 이펙트 */
nav.seg button{position:relative;overflow:hidden;z-index:0}
nav.seg button.on{background:linear-gradient(135deg,#22334d,var(--ink));
  box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 8px 20px rgba(14,23,38,.3)}
nav.seg button.on::after{content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.2),transparent 68%);
  transform:translateX(-120%);animation:sheen 3.6s ease-in-out infinite}
nav.seg button.on::before{background:var(--gold);box-shadow:0 0 9px 2px rgba(240,168,27,.7)}

/* 좌측 레일 선택 이펙트 */
.row.on{background:linear-gradient(120deg,#1b2942,var(--ink) 55%,#182338);
  border-color:transparent;position:relative;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 10px 24px rgba(14,23,38,.3)}
.row.on::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.14),transparent 66%);
  transform:translateX(-120%);animation:sheen 4s ease-in-out infinite}

/* ── 문항 선택(시험지형) ── */
.paperlist{max-height:none;padding:14px;background:#eef1f6;overflow:hidden;border-radius:16px}
.paperlist .sheet{margin:0 0 18px;box-shadow:0 8px 28px rgba(13,15,20,.13)}
.pq.pk{cursor:pointer;border-radius:4px;padding:3px 5px;margin-left:-5px;margin-right:-5px;
  transition:.22s var(--spring);position:relative}
.pq.pk:hover{background:#f2f7ff;box-shadow:0 0 0 1px rgba(31,95,224,.18)}
.pq.pk.on{background:#eaf2ff;box-shadow:0 0 0 1.4px rgba(31,95,224,.55)}
.pq .pmk{margin-left:auto;width:14px;height:14px;border-radius:5px;border:1.2px solid #cbd5e1;
  background:#fff;display:grid;place-items:center;flex:none;transition:.24s var(--spring)}
.pq .pmk svg{width:9px;height:9px;fill:none;stroke:#fff;stroke-width:3.4;opacity:0;transform:scale(.5);transition:.2s var(--spring)}
.pq.pk.on .pmk{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 3px rgba(31,95,224,.16)}
.pq.pk.on .pmk svg{opacity:1;transform:none}
.pq .pedit{margin-left:6px;border:1px solid #dbe3ee;background:#fff;color:#8a97a8;border-radius:999px;
  font-size:7.6px;font-weight:800;padding:1.5px 7px;cursor:pointer;font-family:inherit;
  opacity:0;transition:.22s var(--spring)}
.pq:hover .pedit{opacity:1}
.pq .pedit:hover{border-color:rgba(31,95,224,.4);color:var(--acc);background:#eef4ff}
.pq .pkey{display:none;margin-top:4px;border-top:.8px dashed #d8dfe9;padding-top:3.5px;font-size:9.6px;line-height:1.55}
.showkey .pq .pkey{display:block}
.pq .pkey b{color:#b8332e;font-weight:800;margin-right:4px}
.pq .pkey .pw{color:#7a8798;margin-top:1.5px}
@media print{.pq .pedit,.pq .pmk{display:none!important}.pq.pk{background:none!important;box-shadow:none!important}}

/* 선택 바 */
.pickbar{position:sticky;top:66px;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin:0 0 13px;padding:10px 14px;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(240,246,255,.82));
  border:1px solid rgba(31,95,224,.24);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,1),0 10px 26px rgba(31,95,224,.13);
  animation:drop .28s var(--spring)}
.pickbar .pc{font-family:var(--mono);font-size:12px;font-weight:800;color:#fff;
  background:linear-gradient(160deg,#4b8bff,var(--acc));border-radius:999px;padding:4px 11px;
  box-shadow:0 4px 12px rgba(31,95,224,.35)}
.pickbar b{font-size:13px;font-weight:800}

/* 폴더 */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fcard{position:relative;display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:16px;
  cursor:pointer;text-align:left;font-family:inherit;
  background:linear-gradient(180deg,#fff,#fbfdff);border:1px solid rgba(16,32,64,.08);
  box-shadow:0 1px 2px rgba(16,32,64,.04);transition:.3s var(--spring)}
.fcard:hover{transform:translateY(-3px);border-color:rgba(31,95,224,.32);box-shadow:0 14px 30px rgba(16,32,64,.12)}
.fcard.on{border-color:var(--acc);background:linear-gradient(180deg,#f2f7ff,#eaf1ff);
  box-shadow:0 0 0 1px rgba(31,95,224,.35),0 12px 28px rgba(31,95,224,.16)}
.fcard .fic{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;
  background:linear-gradient(160deg,#fff6e3,#ffe9bd);box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(240,168,27,.22)}
.fcard.add .fic{background:linear-gradient(160deg,#e9f1ff,#d3e3ff);color:var(--acc);font-weight:800}
.fcard .ft{flex:1;min-width:0}
.fcard .ft b{display:block;font-size:13px;font-weight:800;letter-spacing:-.02em;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.fcard .ft i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--sub2);font-weight:700}
.fcard .fx{position:absolute;top:6px;border:0;background:none;color:#c3cede;cursor:pointer;font-size:12px;
  width:20px;height:20px;border-radius:50%;opacity:0;transition:.2s;font-family:inherit}
.fcard .fx{right:26px}.fcard .fx.d{right:5px;font-size:16px;line-height:1}
.fcard:hover .fx{opacity:1}
.fcard .fx:hover{background:#eef2f8;color:var(--ink)}
.fcard .fx.d:hover{background:var(--redBg);color:var(--red)}
.flist{display:grid;gap:6px;max-height:230px;overflow:auto}
.frow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line);background:#fff;font-family:inherit;text-align:left;transition:.22s var(--spring)}
.frow:hover{border-color:rgba(31,95,224,.4);background:var(--accSoft)}
.frow b{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--sub2);font-weight:700}
.frow .fic{font-size:15px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;max-height:120px;overflow:auto}

/* ── 메인화면 ── */
.hero{text-align:center;padding:40px 20px 34px;margin:0 -30px 24px;
  border-bottom:1px solid rgba(31,95,224,.14);position:relative;
  background:radial-gradient(700px 300px at 50% -10%,rgba(31,95,224,.13),transparent 70%),
             linear-gradient(180deg,rgba(240,246,255,.9),rgba(250,252,255,.4))}
.hero::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,rgba(31,95,224,0),var(--acc) 30%,#7fb0ff 60%,rgba(31,95,224,0))}
.hero .hlogo{width:64px;height:auto;display:block;margin:0 auto 15px;padding:9px;background:#fff;
  border:1px solid rgba(16,32,64,.07);border-radius:20px;box-sizing:content-box;
  box-shadow:0 10px 26px rgba(16,32,64,.13)}
.hero .heb{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.32em;color:var(--acc);margin-bottom:8px}
.hero h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.045em;color:var(--ink)}
.hero p{margin:11px 0 0;color:var(--sub);font-size:13.5px;line-height:1.75}
.hstat{display:flex;justify-content:center;flex-wrap:wrap;gap:11px;margin-top:26px}
.hs{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  min-width:138px;padding:15px 20px 14px;border-radius:20px;font-family:inherit;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(248,251,255,.8));
  border:1px solid rgba(255,255,255,.95);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,1),0 1px 2px rgba(16,32,64,.05),0 10px 26px rgba(16,32,64,.09);
  transition:.34s var(--spring)}
.hs::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;opacity:.9;
  background:var(--acc);transition:.34s}
.hs.a::before{background:linear-gradient(90deg,#4b8bff,var(--acc))}
.hs.b::before{background:linear-gradient(90deg,#7c5cf5,#4b8bff)}
.hs.c::before{background:linear-gradient(90deg,#ffc95c,var(--gold))}
.hs.d::before{background:linear-gradient(90deg,#4fd6a8,var(--green))}
.hs:hover{transform:translateY(-4px);border-color:rgba(31,95,224,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,1),0 3px 7px rgba(16,32,64,.06),0 20px 40px rgba(16,32,64,.16)}
.hs:active{transform:translateY(-1px) scale(.99)}
.hsi{width:30px;height:30px;border-radius:11px;display:grid;place-items:center;margin-bottom:5px;
  background:#eef3fa;color:var(--sub2);transition:.34s var(--spring)}
.hsi svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hs.a .hsi{background:rgba(31,95,224,.12);color:var(--acc)}
.hs.b .hsi{background:rgba(124,92,245,.13);color:#6b46d6}
.hs.c .hsi{background:rgba(240,168,27,.16);color:#a8760a}
.hs.d .hsi{background:rgba(14,163,111,.13);color:#0b7a56}
.hs:hover .hsi{transform:scale(1.08) rotate(-3deg)}
.hs b{font-size:24px;font-weight:800;letter-spacing:-.045em;color:var(--ink);line-height:1.15}
.hs span{font-size:11px;font-weight:600;color:var(--sub2);letter-spacing:-.01em}
@media (max-width:640px){.hs{min-width:calc(50% - 6px);padding:13px 12px 12px}.hs b{font-size:20px}}
@media (max-width:760px){.hero{margin:0 -16px 20px;padding:30px 16px 26px}.hero h1{font-size:25px}
  .hstat>div{padding:0 14px}}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(276px,1fr));gap:16px;padding-bottom:10px}
.htile{position:relative;display:flex;flex-direction:column;text-align:left;font-family:inherit;cursor:pointer;
  padding:22px 22px 18px;border-radius:26px;overflow:hidden;isolation:isolate;
  background:linear-gradient(165deg,rgba(255,255,255,.96),rgba(247,250,255,.78));
  border:1px solid rgba(255,255,255,.96);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(16,32,64,.04),
             0 1px 2px rgba(16,32,64,.04),0 14px 34px rgba(16,32,64,.09);
  transition:.36s var(--spring)}
.htile::before{content:'';position:absolute;inset:0;z-index:-1;opacity:.55;transition:.36s;
  background:radial-gradient(420px 200px at 14% -12%,rgba(31,95,224,.14),transparent 68%)}
.htile.t-bank::before{background:radial-gradient(420px 200px at 14% -12%,rgba(124,92,245,.14),transparent 68%)}
.htile.t-books::before{background:radial-gradient(420px 200px at 14% -12%,rgba(240,168,27,.15),transparent 68%)}
.htile.t-rec::before{background:radial-gradient(420px 200px at 14% -12%,rgba(14,163,111,.13),transparent 68%)}
.htile::after{content:'';position:absolute;left:22px;right:22px;top:0;height:2px;z-index:-1;border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,var(--acc),rgba(31,95,224,0));opacity:.85;transition:.36s}
.htile.t-bank::after{background:linear-gradient(90deg,#7c5cf5,rgba(124,92,245,0))}
.htile.t-books::after{background:linear-gradient(90deg,var(--gold),rgba(240,168,27,0))}
.htile.t-rec::after{background:linear-gradient(90deg,var(--green),rgba(14,163,111,0))}
.htile:hover{transform:translateY(-6px);border-color:rgba(255,255,255,1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,1),0 3px 7px rgba(16,32,64,.05),0 30px 60px rgba(16,32,64,.17)}
.htile:hover::before{opacity:1}
.htile:active{transform:translateY(-2px) scale(.995)}
.htile .hi{position:relative;width:50px;height:50px;border-radius:17px;display:grid;place-items:center;
  margin-bottom:15px;background:linear-gradient(155deg,#4b8bff,#1546b8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 22px rgba(31,95,224,.34);
  transition:.36s var(--spring)}
.htile.t-bank .hi{background:linear-gradient(155deg,#9b7cff,#5b32d6);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 22px rgba(107,70,214,.34)}
.htile.t-books .hi{background:linear-gradient(155deg,#ffc95c,#e09405);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 22px rgba(224,148,5,.34)}
.htile.t-rec .hi{background:linear-gradient(155deg,#4fd6a8,#0b8a5e);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 22px rgba(11,138,94,.32)}
.htile:hover .hi{transform:translateY(-2px) scale(1.05) rotate(-3deg)}
.htile .hi svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.htile .he{display:block;font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.26em;color:var(--acc);margin-bottom:5px}
.htile.t-bank .he{color:#6b46d6}.htile.t-books .he{color:#a8760a}.htile.t-rec .he{color:#0b7a56}
.htile b{display:block;font-size:17.5px;font-weight:800;letter-spacing:-.035em;margin-bottom:7px;color:var(--ink)}
.htile .hd{display:block;font-size:12px;color:var(--sub);line-height:1.65;flex:1;min-height:38px}
.htile .hact{display:block;margin-top:16px;padding-top:14px;border-top:1px solid rgba(16,32,64,.07)}
.htile .hbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px;border-radius:999px;
  font-size:13px;font-weight:700;letter-spacing:-.015em;color:#fff;
  background:linear-gradient(160deg,#2b3a52,var(--ink));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 6px 16px rgba(14,23,38,.26);
  transition:.34s var(--spring)}
.htile .hbtn i{font-style:normal;font-size:13px;transition:.34s var(--spring);opacity:.75}
.htile:hover .hbtn{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 24px rgba(14,23,38,.34)}
.htile:hover .hbtn i{transform:translateX(3px);opacity:1}
.htile.t-books .hbtn{background:linear-gradient(160deg,#fbbf3c,#e09405);color:#3a2600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px rgba(224,148,5,.3)}
.htile.t-books:hover .hbtn{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 24px rgba(224,148,5,.38)}

/* ── 사이트 푸터 ── */
footer.site{margin-top:40px;border-top:1px solid rgba(31,95,224,.14);
  background:linear-gradient(180deg,rgba(246,250,255,.7),rgba(233,241,255,.9))}
.fwrap{max-width:none;padding:22px 30px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  font-size:12px;color:var(--sub2)}
.fwrap b{font-family:var(--mono);font-size:11.5px;font-weight:800;letter-spacing:.18em;color:var(--ink)}
.fwrap .cp{margin-left:auto;font-size:11.5px}
@media (max-width:760px){.fwrap{padding:18px 16px}.fwrap .cp{margin-left:0;width:100%}}
@media print{footer.site{display:none!important}}


/* ── 미리보기 팝업 · 문항 교체 ── */
#pvfull{position:fixed;inset:0;z-index:260;display:none;flex-direction:column;background:rgba(12,18,30,.82);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#pvfull.on{display:flex;animation:fadein .22s ease}
.pvbar{flex:none;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 18px;
  background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);
  box-shadow:0 6px 20px rgba(0,0,0,.18)}
.pvbar b{font-size:14px;font-weight:800;letter-spacing:-.02em}
.pvbar .zb{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;
  font-size:15px;font-weight:800;color:var(--sub);cursor:pointer;line-height:1;transition:.2s var(--spring)}
.pvbar .zb:hover{border-color:var(--acc);color:var(--acc);background:var(--accSoft)}
.pvbar .zv{font-family:var(--mono);font-size:11.5px;font-weight:700;min-width:44px;text-align:center;color:var(--sub)}
.pvbody{flex:1;overflow:auto;padding:24px 24px 60px;text-align:center}
.pvbody .sheet{display:inline-block;text-align:left;margin:0 auto 22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
@media (max-width:760px){.pvbar .hint{display:none}}

.pq.qsw{cursor:pointer;border-radius:4px;padding:3px 5px;margin-left:-5px;margin-right:-5px;
  transition:.22s var(--spring);position:relative}
.pq.qsw:hover{background:#f2f7ff;box-shadow:0 0 0 1px rgba(31,95,224,.3)}
.pq .pswap{margin-left:auto;font-size:7.4px;font-weight:800;letter-spacing:.04em;color:#8a97a8;
  border:1px solid #dbe3ee;border-radius:999px;padding:1.5px 7px;background:#fff;opacity:0;transition:.22s}
.pq.qsw:hover .pswap{opacity:1;color:var(--acc);border-color:rgba(31,95,224,.4);background:#eef4ff}
@media print{.pq .pswap{display:none!important}.pq.qsw{background:none!important;box-shadow:none!important}}

.swnow{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fafcff;margin-top:6px}
.swnow .pq{margin:0}
.swlist{display:grid;gap:6px;max-height:270px;overflow:auto;padding-right:4px}
.swlist::-webkit-scrollbar{width:8px}.swlist::-webkit-scrollbar-thumb{background:#d6dee9;border-radius:8px}
.swrow{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line);background:#fff;font-family:inherit;text-align:left;transition:.22s var(--spring)}
.swrow:hover{border-color:rgba(31,95,224,.4);background:var(--accSoft);transform:translateX(2px)}
.swrow .swn{flex:none;font-family:var(--mono);font-size:10.5px;font-weight:800;color:var(--acc);
  background:var(--accSoft);border-radius:7px;padding:3px 8px}
.swrow .swb{flex:1;min-width:0}
.swrow .swb b{display:block;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swrow .swb i{display:block;font-style:normal;font-size:11px;color:var(--sub2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.swrow .swt{flex:none;display:flex;gap:4px}


/* ═══════════════════════════════════════════════════════════
   ORUN — 리파인 패스
   중성 캔버스 · 헤어라인 · 단일 액센트(인디고) · 낮은 채도
   ═══════════════════════════════════════════════════════════ */
:root{
  --ink:#0d0f14; --sub:#585e6b; --sub2:#9096a3;
  --line:#e7e8ec; --line2:#f0f1f4;
  --acc:#5457d6; --acc2:#7b7ce8; --accSoft:#f1f1fd;
  --navy:#5457d6; --blue:#5457d6; --blueBg:#f1f1fd;
  --gold:#c08a2e; --gold2:#9a6d20;
  --green:#189a6b; --greenBg:#eaf7f2;
  --red:#d1453b; --redBg:#fdf1f0;
  --glass:rgba(255,255,255,.78); --glassLine:rgba(255,255,255,.9);
  --pnl:rgba(255,255,255,.72);
  --shadow:0 1px 2px rgba(13,15,20,.05),0 1px 1px rgba(13,15,20,.03);
  --shadow2:0 2px 4px rgba(13,15,20,.04),0 14px 34px rgba(13,15,20,.1);
  --r2:16px;
}
body{background:#fafafb;color:var(--ink);font-size:13.8px;letter-spacing:-.011em;
  min-height:100vh;display:flex;flex-direction:column}
/* flex 자식에서 margin:0 auto 는 축소·중앙정렬을 일으킨다 — 폭을 되돌린다 */
main{flex:1 0 auto;margin:0;width:100%;align-self:stretch}
footer.site{flex:none}
@media print{body{display:block}}
::selection{background:rgba(84,87,214,.16)}
#glow{background:
  radial-gradient(1000px 460px at 50% -12%,rgba(84,87,214,.07),transparent 70%),
  linear-gradient(180deg,#fbfbfd,#fafafb 40%)}
#grid{opacity:.5;background-size:44px 44px;
  background-image:linear-gradient(rgba(13,15,20,.022) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(13,15,20,.022) 1px,transparent 1px);
  -webkit-mask-image:radial-gradient(ellipse 80% 50% at 50% 12%,#000 20%,transparent 100%);
          mask-image:radial-gradient(ellipse 80% 50% at 50% 12%,#000 20%,transparent 100%)}

/* 헤더 */
header.top{background:rgba(255,255,255,.8);border-bottom:1px solid var(--line);box-shadow:none;
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.mark{background:#fff;border:1px solid var(--line);box-shadow:none;border-radius:10px;width:32px;height:32px}
.brand em{color:var(--sub2);letter-spacing:.24em}
.brand:hover{background:rgba(13,15,20,.035)}
nav.seg{background:#f2f3f6;border:1px solid var(--line);padding:3px;box-shadow:none}
nav.seg button{padding:6px 15px;font-size:12.5px;font-weight:600;color:var(--sub)}
nav.seg button::before{display:none}
nav.seg button:hover{background:rgba(13,15,20,.045);color:var(--ink)}
nav.seg button.on{background:#fff;color:var(--ink);font-weight:700;
  box-shadow:0 1px 2px rgba(13,15,20,.1),0 0 0 1px rgba(13,15,20,.05)}
nav.seg button.on::after{display:none}
.pro{background:#f2f3f6;border:1px solid var(--line);color:var(--sub2);font-size:9.5px}
.chip{background:#fff;border:1px solid var(--line);color:var(--sub);box-shadow:none}
.chip:hover{border-color:#c9cbd6;background:#fafafb}

/* 페이지 머리글 */
.phead{background:none;border-bottom:1px solid var(--line);padding:26px 30px 22px;gap:14px}
.phead::after{display:none}
.phead .pico{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(13,15,20,.05)}
.phead .pico svg{stroke:var(--acc);width:20px;height:20px;stroke-width:1.7}
.phead .eb{color:var(--sub2);letter-spacing:.2em;font-size:9.5px}
.phead h1{font-size:23px;font-weight:750;letter-spacing:-.03em}
.phead p{font-size:12.5px;color:var(--sub)}
@media (max-width:760px){.phead{padding:20px 16px 16px}}

/* 패널 */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  backdrop-filter:none;-webkit-backdrop-filter:none;padding:18px}
.card.solid{background:#fff}
.ttl{color:var(--sub);font-size:11.5px;font-weight:650;border-bottom:1px solid var(--line2);
  padding-bottom:11px;margin-bottom:14px}
.ttl svg{stroke:var(--sub2)}
.grp{color:var(--sub2);font-size:10px;font-weight:700;letter-spacing:.06em}
.grp::after{background:var(--line2)}

/* 좌측 레일 — 골드 제거, 중성 + 인디고 마커 */
.side{padding:14px 12px}
.row{background:#fff;border:1px solid transparent;border-radius:10px;padding:7px 10px;
  font-size:12.8px;font-weight:600;margin-bottom:2px;box-shadow:none}
.row::before{color:var(--sub2);opacity:.7;font-size:9px}
.row .dot{background:#d5d7de}
.row:hover{background:#f4f5f8;border-color:transparent;box-shadow:none;transform:none}
.row .n{color:var(--sub2)}
.row.all{background:#f6f6fb;border:1px solid #e6e6f4;font-weight:700;color:var(--ink)}
.row.all::after{width:2px;top:8px;bottom:8px;background:var(--acc);border-radius:0 2px 2px 0}
.row.all::before{color:var(--acc);opacity:.8}
.row.all .dot{background:var(--acc);box-shadow:none}
.row.all .n{color:var(--acc)}
.row.all:hover{background:#eeeefb;border-color:#dcdcf2;box-shadow:none}
.row.on,.row.all.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:none}
.row.on::after,.row.all.on::after{background:#fff;opacity:.55;box-shadow:none}
.row.on::before,.row.all.on::before{color:rgba(255,255,255,.5)}
.row.on .dot,.row.all.on .dot{background:#fff;box-shadow:none}
.row.on .n,.row.all.on .n{color:rgba(255,255,255,.55)}
.row .selc{background:var(--acc);box-shadow:none;font-size:9px;padding:2px 6px}
.row.on .selc,.row.all.on .selc{background:rgba(255,255,255,.22);color:#fff}

/* 스텝 */
.step{background:#fff;border:1px solid var(--line);box-shadow:none;border-radius:14px;padding:11px 15px}
.step b{background:#e9eaef;color:#fff}
.step.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:none}
.step.on::after{display:none}
.step.on b{background:#fff;color:var(--ink)}
.step.on small{color:rgba(255,255,255,.6)}
.step.done{background:#fff;border-color:#d6ecdf;color:#157a55}
.step.done b{background:var(--green)}

/* 탭 · 트리 */
.gtabs,.mode{background:#f2f3f6;border:1px solid var(--line);box-shadow:none}
.gtabs button.on,.mode button.on{background:#fff;box-shadow:0 1px 2px rgba(13,15,20,.1),0 0 0 1px rgba(13,15,20,.05)}
.tree{background:#fff;border-color:var(--line);border-radius:12px}
.les>.h{background:#f6f7f9;color:var(--ink)}
.les>.h:hover{background:#f0f1f5}
.les.op>.h{background:var(--accSoft);color:var(--acc);box-shadow:none}
.les.allsel>.h{background:#eeeefb;color:var(--acc);box-shadow:inset 0 0 0 1px #ddddf5}
.les.op.allsel>.h{background:#e9e9fa}
.it:hover{background:#f6f7f9}
.it.sel{background:var(--accSoft);color:var(--ink);box-shadow:inset 0 0 0 1px #e2e2f7;font-weight:650}
.it::before{background:var(--acc);box-shadow:none;width:2px}
.it.sel .qn{color:var(--acc)}
.it.sel .gd{background:#e4e4f8;color:var(--acc)}
.chk{background:#fff;border:1.4px solid #cfd2da;box-shadow:none}
.it.sel .chk,.les.allsel>.h .chk{background:var(--acc);border-color:var(--acc);box-shadow:none;animation:none}
.it.sel .chk svg,.les.allsel>.h .chk svg{animation:none}

/* 폼 */
.pill{background:#fff;border:1px solid var(--line);box-shadow:none;color:var(--sub);height:34px;font-size:12.5px}
.pill:hover{background:#f6f7f9;border-color:#d4d6de;color:var(--ink);transform:none;box-shadow:none}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:none}
.lvchip,.numin{height:38px;background:#fff;border:1px solid var(--line);box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none}
.lvchip::after,.numin::after{display:none}
.lvchip:hover,.numin:hover{transform:none;box-shadow:none;border-color:#d4d6de}
.lvchip:focus-within,.numin:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(84,87,214,.12)}
.lvchip.s상:focus-within,.lvchip.s중:focus-within,.lvchip.s하:focus-within,
.lvchip.s객관식:focus-within,.lvchip.s주관식:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(84,87,214,.12)}
.lvchip>span:first-child,.numin i{margin:4px 0 4px 4px;background:#f2f3f6;color:var(--sub);font-size:11px}
.lvchip.s상>span:first-child{background:#fdeeed;color:#b93a31}
.lvchip.s중>span:first-child{background:#fbf3e4;color:#8f6519}
.lvchip.s하>span:first-child{background:#e9f6f1;color:#157a55}
.lvchip.s객관식>span:first-child{background:var(--accSoft);color:var(--acc)}
.lvchip.s주관식>span:first-child{background:#fbf3e4;color:#8f6519}
.lvchip .num,.numin .num{height:36px;font-size:14px}
.txt{height:38px;background:#fff;border:1px solid var(--line);box-shadow:none;border-radius:10px}
.sw i{background:#dcdee4}.sw.on i{background:var(--green)}
.hint{color:var(--sub2)}

/* 버튼 */
.btn{background:var(--ink);border-radius:10px;height:38px;box-shadow:none;font-weight:650}
.btn:hover{background:#22252e;box-shadow:none;transform:none}
.btn.sm{height:31px;border-radius:9px}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.ghost:hover{background:#f6f7f9;border-color:#d4d6de;color:var(--ink);box-shadow:none;transform:none}
.btn.gold{background:#f5efdf;color:#8f6519;border:1px solid #ecdfc2;box-shadow:none}
.btn.gold:hover{background:#f0e6cf}
.btn:disabled{background:#f2f3f6;color:#b6bac4;border:1px solid var(--line)}
.keybtn{height:31px;border-radius:9px;background:#fff;border:1px solid var(--line);color:var(--sub)}
.keybtn:hover{background:#f6f7f9;border-color:#d4d6de;color:var(--ink)}
.keybtn.on{background:var(--red);border-color:var(--red);color:#fff}
.acts{background:#fafafb;border:1px solid var(--line);border-radius:14px;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none}

/* 통계 · 요약 */
.sumbar{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none}
.sumbar .su b{font-size:18px;font-weight:750}
.sumbar .su.lv i{font-size:11.5px;border-radius:6px}
.sumbar .su.lv i.a{background:#fdeeed;color:#b93a31}
.sumbar .su.lv i.b{background:#fbf3e4;color:#8f6519}
.sumbar .su.lv i.c{background:#e9f6f1;color:#157a55}
.stat>div{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none}
.stat b{font-size:21px;font-weight:750}

/* 카드 */
.cat,.bk,.fcard{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  backdrop-filter:none;-webkit-backdrop-filter:none}
.cat{border-radius:14px}
.cat::before{display:none}
.cat:hover,.bk:hover{transform:translateY(-2px);border-color:#d4d6de;box-shadow:var(--shadow2)}
.cat .gi{border-radius:10px;box-shadow:none;background:#f2f3f6;color:var(--sub);font-size:11.5px;width:38px;height:38px}
.cat.g중1 .gi{background:var(--accSoft);color:var(--acc);box-shadow:none}
.cat.g중2 .gi{background:#e9f6f1;color:#157a55;box-shadow:none}
.cat.g중3 .gi{background:#f0edfb;color:#6b46d6;box-shadow:none}
.cat.g고등 .gi{background:#fbf3e4;color:#8f6519;box-shadow:none}
.cat:hover .gi{transform:none}
.cat .no,.bkb .no{border-color:var(--line);color:var(--sub2);background:#fff}
.cat:hover .no,.bk:hover .bkb .no{background:#f6f7f9;color:var(--sub);border-color:var(--line)}
.cat .mp,.bkb .meta i{background:#f2f3f6;color:var(--sub);border-radius:6px;font-weight:700}
.cat .mp.b,.bkb .meta i.b{background:var(--accSoft);color:var(--acc)}
.cat .mp.g,.bkb .meta i.g{background:#e9f6f1;color:#157a55}
.bkb .meta i.p{background:#fbf3e4;color:#8f6519}
.cat .go,.bkb .go{background:#f2f3f6;color:var(--sub2)}
.cat:hover .go,.bk:hover .bkb .go{background:var(--ink);color:#fff;box-shadow:none;transform:none}
.cov{border-radius:3px 6px 6px 3px;box-shadow:0 4px 12px rgba(13,15,20,.16),0 0 0 1px rgba(13,15,20,.07)}
.bk:hover .cov{transform:none;box-shadow:0 8px 20px rgba(13,15,20,.2),0 0 0 1px rgba(13,15,20,.1)}
.fcard.on{background:var(--accSoft);border-color:var(--acc);box-shadow:none}
.fcard .fic{background:#f2f3f6;box-shadow:none;border-radius:9px}
.fcard.add .fic{background:var(--accSoft);color:var(--acc)}

/* 트랙 스위치 */

function sky(){
  const c=document.getElementById('sky'); if(!c) return; const x=c.getContext('2d');
  let W,H,st=[];
  function seed(){ W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio;
    const n=Math.min(300,Math.round(innerWidth*innerHeight/6400)); st=[];
    for(let i=0;i<n;i++){ const r=Math.random();
      st.push({x:Math.random()*W,y:Math.random()*H,r:(r*r*1.9+.35)*devicePixelRatio,
        a:.18+Math.random()*.6,s:Math.random()*Math.PI*2,
        v:(Math.random()*.09+.015)*devicePixelRatio,p:r>.88}); } }
  seed(); addEventListener('resize',seed);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ draw(0); return; }
  function draw(t){
    x.clearRect(0,0,W,H);
    for(const s of st){ s.y-=s.v; if(s.y<-2) s.y=H+2;
      const a=s.a*(.55+.45*Math.sin(t/900+s.s));
      x.beginPath(); x.arc(s.x,s.y,s.r,0,6.284);
      x.fillStyle=s.p?'rgba(255,120,175,'+a+')':'rgba(255,255,255,'+a+')';
      if(s.p){ x.shadowBlur=9*devicePixelRatio; x.shadowColor='rgba(255,45,120,.85)'; } else x.shadowBlur=0;
      x.fill(); }
    x.shadowBlur=0; requestAnimationFrame(draw); }
  requestAnimationFrame(draw);}

/* ── 발문 · 본문 분리 파서 ──
   "발문? 본문" 처럼 한 줄에 붙어 있는 문항을 발문 / 본문 상자로 나누고,
   ㄱㄴㄷ · 불릿 · 대화(A:/B:) · <보기> · 조건을 각각 한 줄씩 세운다. */
const SBOX=/^(<보기>|\[보기\]|〈보기〉|＜보기＞|\(조건[^)]*\)|조건[:：])/;
function parseStem(raw){
  let s=String(raw==null?'':raw).replace(/\r/g,'').replace(/[ \t]+\n/g,'\n').trim();
  const i=s.indexOf('\n');
  let head=i>=0?s.slice(0,i):s, tail=i>=0?s.slice(i+1):'';
  let ask=head.trim(), rest=tail.trim();
  const m=head.match(/^(.*?[가-힣].*?(?:[?？]|(?:시오|세요|쓰라|하라)[.。:：,]?))\s+(\S[\s\S]*)$/);
  if(m){ ask=m[1].trim(); rest=(m[2].trim()+(rest?'\n'+rest:'')).trim(); }
  /* 한글 발문이 없는 문항(영문 문장·대화만 있는 경우)은 전부 본문 상자로 보낸다 */
  if(!/[가-힣]/.test(ask)){ rest=(ask+(rest?'\n'+rest:'')).trim(); ask=''; }
  return {ask:ask, lines:stemLines(rest)};
}
function stemLines(t){
  if(!t) return [];
  t=t.replace(/\s*(<보기>|\[보기\]|〈보기〉|＜보기＞)\s*/g,'\n$1 ')
     .replace(/([ㄱ-ㅎ])\.\s+/g,'\n$1. ')
     .replace(/\s*•\s*/g,'\n• ')
     .replace(/(^|\s)·\s+/g,'\n• ')
     .replace(/(^|\s)([ABC])\s*[:：]\s*/g,'\n$2: ')
     .replace(/\s*(\(조건[^)]*\))\s*$/,'\n$1');
  const raw=[];
  t.split('\n').map(x=>x.trim()).filter(Boolean).forEach(function(x){ splitKo(x).forEach(y=>raw.push(y)); });
  return raw.map(function(x){
    const k=x.match(/^([ㄱ-ㅎ]\.|•|[ABC]:|<보기>|\[보기\]|〈보기〉|＜보기＞)\s*/);
    const ko=!/[A-Za-z]/.test(x)&&/[가-힣]/.test(x);
    return k?{mk:k[1],tx:x.slice(k[0].length),lb:SBOX.test(x),ko:ko}
            :{mk:'',tx:x,lb:SBOX.test(x),ko:ko};
  });
}
/* 영문 문장 뒤에 붙은 우리말(괄호 병기 포함)은 줄을 바꾼다 */
function splitKo(t){
  const m=String(t).match(/^(.*[A-Za-z][^가-힣]*?)\s*([(（\[]?\s*[가-힣][\s\S]*)$/);
  if(!m) return [t];
  const en=m[1].trim(), ko=m[2].trim();
  if(en.replace(/<\/?u>/g,'').length<4||!/[A-Za-z]/.test(en)) return [t];
  return [en,ko];
}

/* ── 출제 계획 ── */
function planMatrix(N,lvN,tyN){
  const out=[];
  LVS.forEach(l=>{const n=lvN[l]||0; if(!n)return;
    let mc=Math.round(n*(tyN.mc/Math.max(1,N))); mc=Math.max(0,Math.min(mc,n));
    out.push({level:l,type:'mc',need:mc},{level:l,type:'short',need:n-mc});});
  let cur=out.filter(o=>o.type==='mc').reduce((s,o)=>s+o.need,0), guard=0;
  while(cur!==tyN.mc&&guard++<200){
    const up=cur<tyN.mc;
    const src=out.filter(o=>o.type===(up?'short':'mc')&&o.need>0).sort((a,b)=>b.need-a.need)[0];
    if(!src)break;
    const dst=out.find(o=>o.level===src.level&&o.type!==src.type);
    if(!dst)break;
    src.need--;dst.need++;cur+=up?1:-1;
  }
  return out.filter(o=>o.need>0);
}
function pool(ids,levels,types){
  const P=[];ids.forEach(id=>{const c=byId[id];if(!c)return;
    c.questions.forEach(q=>{if(levels.indexOf(q.level)<0)return;if(types.indexOf(q.type)<0)return;
      P.push(Object.assign({cat:c.name,catId:c.id,grade:c.grade},q));});});
  return P;}
function pickQuestions(cfg){
  const rnd=mulberry(cfg.seed);
  const used=cfg.noDup?new Set(JSON.parse(localStorage.getItem('og.used')||'[]')):new Set();
  let out=[];
  planMatrix(cfg.total,cfg.lvN,cfg.tyN).forEach(m=>{
    let P=pool(cfg.cats,[m.level],[m.type]);
    const fresh=P.filter(q=>!used.has(q.catId+'#'+q.no));
    P=shuf(fresh.length>=m.need?fresh:P,rnd);
    out=out.concat(P.slice(0,m.need));});
  /* 기본 순서 — 순서대로: 선택한 항목 차례 → 문항 번호 / 랜덤: 셔플 */
  if(cfg.order==='seq'){
    const rank={}; (cfg.cats||[]).forEach((id,i)=>{rank[id]=i;});
    out.sort((a,b)=>((rank[a.catId]===undefined?999:rank[a.catId])-(rank[b.catId]===undefined?999:rank[b.catId]))
      || (a.no-b.no));
  } else out=shuf(out,rnd);
  /* 주관식 배치 */
  const sp=cfg.spos||'back';
  if(sp==='front') out.sort((a,b)=>a.type===b.type?0:(a.type==='short'?-1:1));
  else if(sp==='back') out.sort((a,b)=>a.type===b.type?0:(a.type==='mc'?-1:1));
  /* mix: 유형별로 묶지 않고 기본 순서를 그대로 둔다 */
  return out.map((q,i)=>Object.assign({},q,{seq:i+1}));}
function poolStat(ids){
  const r={상:{mc:0,short:0},중:{mc:0,short:0},하:{mc:0,short:0},all:0};
  ids.forEach(id=>{const c=byId[id];if(!c)return;c.questions.forEach(q=>{r[q.level][q.type]++;r.all++;});});
  return r;}

  const M=mmpx(), total=(PGH-PADT-PADB)*M;
