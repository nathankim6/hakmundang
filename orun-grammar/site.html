<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>옳은문법 ORUN GRAMMAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1220; --sub:#64748b; --sub2:#94a3b8;
  --line:#e6ebf2; --line2:#eef2f7;
  --navy:#0f1b2d; --gold:#f5b01b; --gold2:#c98d0a;
  --green:#10b981; --greenBg:#ecfdf5;
  --red:#e0524d; --redBg:#fdf0ef;
  --blue:#2f6df6; --blueBg:#eef4ff;
  --glass:rgba(255,255,255,.72); --glassLine:rgba(255,255,255,.85);
  --shadow:0 1px 2px rgba(15,27,45,.04),0 8px 28px rgba(15,27,45,.07);
  --shadow2:0 2px 6px rgba(15,27,45,.06),0 18px 48px rgba(15,27,45,.12);
  --r2:22px; --spring:cubic-bezier(.34,1.4,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{color:var(--ink);background:#f5f7fb;
  font-family:'Noto Sans KR','Noto Sans',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  font-size:14.5px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;letter-spacing:inherit}
#aura{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(1200px 700px at 10% -10%,#e8f0ff 0%,transparent 60%),
  radial-gradient(900px 600px at 100% 0%,#fff5e0 0%,transparent 55%),
  radial-gradient(1000px 800px at 50% 110%,#eafaf3 0%,transparent 60%),#f5f7fb}
#aura i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:float 22s var(--spring) infinite alternate}
#aura i:nth-child(1){width:460px;height:460px;background:#bcd4ff;left:-6%;top:-8%}
#aura i:nth-child(2){width:380px;height:380px;background:#ffe0a8;right:-4%;top:6%;animation-duration:27s}
#aura i:nth-child(3){width:420px;height:420px;background:#b9f0d8;left:38%;bottom:-14%;animation-duration:31s}
@keyframes float{to{transform:translate3d(60px,50px,0) scale(1.14)}}
@media (prefers-reduced-motion:reduce){#aura i{animation:none}}

header.top{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.72);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid rgba(230,235,242,.9)}
.hwrap{max-width:1340px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--navy),#243b5e);
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(15,27,45,.28)}
.mark svg{width:19px;height:19px}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand em{font-style:normal;color:var(--sub2);font-weight:600;font-size:10.5px;letter-spacing:.22em;display:block;margin-top:-3px}
nav.seg{margin-left:auto;display:flex;gap:2px;background:#eef1f6;padding:3px;border-radius:12px}
nav.seg button{border:0;background:none;color:var(--sub);padding:7px 15px;border-radius:9px;
  font-size:13.5px;font-weight:600;cursor:pointer;transition:.25s var(--spring);white-space:nowrap}
nav.seg button:hover{color:var(--ink)}
nav.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.12);font-weight:700}
.pro{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--sub);background:#eef1f6;border-radius:999px;padding:6px 13px}

main{max-width:1340px;margin:0 auto;padding:22px 22px 80px}
.layout{display:grid;grid-template-columns:246px 1fr;gap:18px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:1fr}}
.card{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glassLine);border-radius:var(--r2);box-shadow:var(--shadow);padding:18px}
.card.solid{background:#fff}
.ttl{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--sub);margin:0 0 12px}
.ttl svg{width:15px;height:15px;stroke:var(--sub2);fill:none;stroke-width:1.8}
.ttl .r{margin-left:auto;font-weight:600;color:var(--sub2);font-size:11.5px}

.side{position:sticky;top:74px;max-height:calc(100vh - 96px);overflow:auto}
.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:#dde3ec;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.grp{font-size:11px;font-weight:800;color:var(--sub2);letter-spacing:.14em;margin:14px 4px 7px}
.grp:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:#f4f6fa;
  border:1px solid transparent;cursor:pointer;transition:.22s var(--spring);margin-bottom:5px;font-size:13.5px;font-weight:600}
.row:hover{background:#eef2f8;transform:translateX(2px)}
.row .dot{width:7px;height:7px;border-radius:50%;background:#cbd5e1;flex:none;transition:.2s}
.row .n{margin-left:auto;font-size:11px;color:var(--sub2);font-weight:600}
.row.all{background:var(--blueBg)}
.row.on{background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(15,27,45,.24);transform:none}
.row.on .dot{background:var(--gold);box-shadow:0 0 0 3px rgba(245,176,27,.25)}
.row.on .n{color:rgba(255,255,255,.6)}
.gtabs{display:flex;gap:4px;background:#eef1f6;padding:3px;border-radius:11px;margin-bottom:12px}
.gtabs button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:.22s var(--spring)}
.gtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.12)}

.steps{display:flex;gap:10px;margin-bottom:16px}
.step{flex:1;display:flex;align-items:center;gap:11px;padding:13px 18px;border-radius:15px;background:#eef1f6;
  color:var(--sub);font-weight:700;font-size:13.5px;position:relative;overflow:hidden;transition:.3s var(--spring)}
.step b{width:23px;height:23px;border-radius:50%;background:#d8dfe9;color:#fff;display:grid;place-items:center;font-size:11.5px;flex:none;transition:.3s}
.step small{font-weight:500;color:var(--sub2);font-size:11.5px;margin-left:auto}
.step.on{background:linear-gradient(100deg,var(--navy),#28405f);color:#fff;box-shadow:0 8px 24px rgba(15,27,45,.26)}
.step.on b{background:var(--gold);color:var(--navy)}
.step.on small{color:rgba(255,255,255,.65)}
.step.on::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.22),transparent 70%);
  transform:translateX(-120%);animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.step.done{background:var(--greenBg);color:#0b7a56}.step.done b{background:var(--green)}

.mode{display:flex;gap:4px;background:#eef1f6;padding:3px;border-radius:11px;margin-bottom:12px;width:fit-content}
.mode button{border:0;background:none;padding:7px 16px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:.22s var(--spring)}
.mode button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.12)}
.tree{max-height:392px;overflow:auto;border:1px solid var(--line);border-radius:15px;background:#fff;padding:7px}
.tree::-webkit-scrollbar{width:9px}.tree::-webkit-scrollbar-thumb{background:#dde3ec;border-radius:9px;border:3px solid #fff}
.les{border-radius:12px;overflow:hidden;margin-bottom:4px}
.les>.h{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#f6f8fb;cursor:pointer;font-weight:700;font-size:13px;transition:.2s}
.les>.h:hover{background:#eef2f8}
.les>.h .cv{transition:.3s var(--spring);color:var(--sub2);font-size:10px}
.les.op>.h .cv{transform:rotate(90deg)}
.les>.h .lb{color:var(--sub2);font-weight:500;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.les>.b{display:none;padding:5px 6px 8px}
.les.op>.b{display:block;animation:drop .3s var(--spring)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.it{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:10px;cursor:pointer;transition:.18s;font-size:13.5px}
.it:hover{background:#f6f8fb}
.it.sel{background:var(--blueBg)}
.chk{width:18px;height:18px;border-radius:6px;border:1.6px solid #cbd5e1;flex:none;display:grid;place-items:center;
  transition:.2s var(--spring);background:#fff}
.chk svg{width:11px;height:11px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0;transform:scale(.5);transition:.2s var(--spring)}
.it.sel .chk,.les.allsel>.h .chk{background:var(--navy);border-color:var(--navy)}
.it.sel .chk svg,.les.allsel>.h .chk svg{opacity:1;transform:none}
.it .gd{font-size:10px;font-weight:800;color:var(--sub2);background:#f1f5f9;border-radius:5px;padding:1px 6px;flex:none}
.it .qn{margin-left:auto;font-size:11px;color:var(--sub2);font-weight:600;flex:none}

.opt{display:grid;grid-template-columns:92px 1fr;gap:11px 14px;align-items:center}
.opt>label{font-size:12.5px;font-weight:700;color:var(--sub)}
.pills{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pill{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 13px;font-size:12.5px;font-weight:700;
  color:var(--sub);cursor:pointer;transition:.22s var(--spring)}
.pill:hover{border-color:#c3cede;transform:translateY(-1px)}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 5px 14px rgba(15,27,45,.22)}
.num{width:66px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px;font-weight:700;text-align:center;background:#fff}
.num:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,27,45,.08)}
.txt{border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:13.5px;background:#fff;width:100%;max-width:340px}
.txt:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,27,45,.08)}
.lvbox{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.lvchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:11px;padding:5px 5px 5px 12px;background:#fff}
.lvchip span{font-size:12.5px;font-weight:800}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.sw i{width:38px;height:22px;border-radius:999px;background:#dde3ec;position:relative;transition:.28s var(--spring);flex:none}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.28s var(--spring)}
.sw.on i{background:var(--green)}.sw.on i::after{transform:translateX(16px)}
.warn{font-size:12px;color:var(--red);font-weight:600}
.okmsg{font-size:12px;color:var(--green);font-weight:600}

.btn{position:relative;overflow:hidden;border:0;border-radius:13px;padding:12px 26px;font-size:14px;font-weight:700;
  cursor:pointer;transition:.25s var(--spring);background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(15,27,45,.24)}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(15,27,45,.3)}
.btn:active{transform:translateY(0) scale(.985)}
.btn:disabled{opacity:.4;box-shadow:none;transform:none;cursor:not-allowed}
.btn.gold{background:linear-gradient(140deg,#f7bb35,#e39a06);color:#3a2600;box-shadow:0 6px 18px rgba(227,154,6,.35)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.ghost:hover{border-color:#c3cede}
.btn.sm{padding:8px 16px;font-size:12.5px;border-radius:11px}
.btn .rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}
@keyframes rp{to{transform:scale(3.2);opacity:0}}
.keybtn{border:1.6px solid var(--red);color:var(--red);background:#fff;border-radius:11px;padding:8px 17px;
  font-weight:800;font-size:13px;cursor:pointer;transition:.22s var(--spring)}
.keybtn:hover{background:var(--redBg)}
.keybtn.on{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(224,82,77,.3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:13px}
.cat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 17px;cursor:pointer;
  transition:.28s var(--spring);position:relative;overflow:hidden;animation:pop .45s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.cat::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--gold),#f7d27a);transform:scaleX(0);transform-origin:left;transition:.35s var(--spring)}
.cat:hover{transform:translateY(-4px);box-shadow:var(--shadow2);border-color:#dbe3ee}
.cat:hover::before{transform:none}
.cat .no{position:absolute;top:15px;right:16px;color:#dae1eb;font-weight:900;font-size:13px}
.cat b{display:block;font-size:14.5px;font-weight:700;margin-bottom:6px;padding-right:34px;line-height:1.35}
.cat .pts{color:var(--sub);font-size:12px;min-height:32px;line-height:1.5}
.cat .meta{display:flex;gap:5px;margin-top:11px;font-size:10.5px;font-weight:800}
.cat .meta i{font-style:normal;border-radius:6px;padding:3px 8px;background:#f1f5f9;color:var(--sub)}
.cat .meta i.g{background:#fff7e6;color:var(--gold2)}
.cat .meta i.b{background:var(--blueBg);color:#2450b8}

.tools{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:12px 0 15px}
.crumb{color:var(--sub);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;transition:.2s}
.crumb:hover{color:var(--ink);transform:translateX(-2px)}
.q{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 18px;margin-bottom:9px;transition:.24s var(--spring)}
.q:hover{border-color:#dbe3ee;box-shadow:var(--shadow)}
.q .head{display:flex;gap:11px;align-items:flex-start}
.q .num{font-weight:800;color:var(--navy);min-width:26px;font-size:13.5px;padding-top:1px}
.q .stem{white-space:pre-wrap;line-height:1.72}
.q ol.ch{list-style:none;margin:9px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 20px}
.q ol.ch li{font-size:14px;line-height:1.7}
.tags{display:flex;gap:4px;flex:none;margin-left:auto}
.tag{font-size:10px;font-weight:800;border-radius:6px;padding:3px 7px;background:#f1f5f9;color:var(--sub)}
.tag.lv하{background:var(--greenBg);color:#0b7a56}.tag.lv중{background:#fff7e6;color:var(--gold2)}.tag.lv상{background:var(--redBg);color:#b8332e}
.q .ans{display:none;margin-top:11px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
.showkey .q .ans{display:block;animation:drop .3s var(--spring)}
.q .ans b{color:var(--red);font-weight:800}
.q .ans .why{color:var(--sub);margin-top:3px;line-height:1.65}
u{text-underline-offset:3.5px;text-decoration-thickness:1.4px}

.tq{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 20px;margin-bottom:11px;transition:.24s}
.tq:hover{box-shadow:var(--shadow)}
.tq .opts{display:grid;gap:6px;margin-top:10px}
.tq .opts label{display:flex;gap:10px;align-items:flex-start;padding:9px 13px;border:1px solid var(--line);
  border-radius:11px;cursor:pointer;font-size:14px;transition:.2s var(--spring);background:#fff}
.tq .opts label:hover{background:#f6f8fb;border-color:#cfd9e6}
.tq .opts label.sel{border-color:var(--navy);background:#f3f6fb;font-weight:600;box-shadow:0 0 0 2px rgba(15,27,45,.06)}
.tq .opts input{margin-top:4px;accent-color:var(--navy)}
.shorta{width:100%;max-width:440px;border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-size:14px;margin-top:10px}
.shorta:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,27,45,.08)}
.sticky{position:sticky;bottom:14px;margin-top:18px;background:rgba(255,255,255,.82);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glassLine);border-radius:17px;box-shadow:var(--shadow2);padding:12px 18px;
  display:flex;align-items:center;gap:14px;z-index:20;flex-wrap:wrap}
.prog{flex:1;height:7px;background:#eef1f6;border-radius:999px;overflow:hidden;max-width:280px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f7d27a);border-radius:999px;transition:.4s var(--spring)}

.score{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:#eef1f6}
.ring .fg{stroke:url(#gr);transition:stroke-dashoffset 1.1s var(--spring)}
.ring .lab{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lab b{font-size:31px;font-weight:800;line-height:1;letter-spacing:-.03em}
.ring .lab span{font-size:10.5px;color:var(--sub2);font-weight:700}
.bar{display:grid;grid-template-columns:186px 1fr 84px;gap:12px;align-items:center;margin-bottom:8px;font-size:13px}
.bar .tr{background:#eef1f6;border-radius:999px;height:9px;overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(90deg,var(--navy),#3a5580);border-radius:999px;width:0;transition:width .9s var(--spring)}
.bar.weak .fl{background:linear-gradient(90deg,#e0524d,#f08b87)}
.bar .pc{text-align:right;color:var(--sub);font-weight:700;font-size:12px}
table.rep{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;margin-top:9px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}
table.rep th,table.rep td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
table.rep tr:last-child td{border-bottom:0}
table.rep th{background:#f6f8fb;color:var(--sub);font-weight:700;font-size:12px}
td.ok{color:var(--green);font-weight:900;text-align:center}td.no{color:var(--red);font-weight:900;text-align:center}
.advice{background:linear-gradient(120deg,#fffaf0,#fff5e3);border:1px solid #f6e3b8;border-radius:15px;padding:14px 18px;margin-top:14px;font-size:13px}
.codebox{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#f6f8fb;border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;word-break:break-all;user-select:all;line-height:1.6}
.hint{color:var(--sub);font-size:12.5px}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat>div{flex:1;min-width:132px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 17px}
.stat b{display:block;font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.stat span{font-size:11.5px;color:var(--sub);font-weight:600}

#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,26px);z-index:200;opacity:0;pointer-events:none;
  background:rgba(15,27,45,.94);color:#fff;padding:12px 22px;border-radius:14px;font-size:13.5px;font-weight:600;
  box-shadow:0 12px 34px rgba(15,27,45,.35);transition:.36s var(--spring)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ══ 시험지 ══ */
#paper{display:none}
.sheet{background:#fff;width:210mm;min-height:297mm;margin:0 auto 16px;padding:14mm 13mm 15mm;position:relative;
  box-shadow:0 8px 40px rgba(15,27,45,.16);border-radius:3px;
  font-family:'Noto Sans KR','Noto Sans',sans-serif;color:#111}
.exh{display:flex;align-items:stretch;border-bottom:2.4px solid #0f1b2d;padding-bottom:8px}
.exh .lft{display:flex;align-items:center;gap:10px}
.exh .bar{width:4px;border-radius:2px;background:linear-gradient(#f5b01b,#e39a06)}
.exh .t1{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.25}

<body>
<div id="aura"><i></i><i></i><i></i></div>
<script id="bank-data" type="application/json">__BANK__</script>

<header class="top"><div class="hwrap">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#f5b01b" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M8.5 8.5h6M8.5 12h4"/></svg></div>
    <div><b>옳은문법</b><em>ORUN GRAMMAR</em></div>
  </div>
  <nav class="seg" id="nav"></nav>
  <span class="pro">PRO</span>
</div></header>

<main id="view"></main>
<div id="paper"></div>
<div id="toast"></div>

<script>
'use strict';
const DATA=JSON.parse(document.getElementById('bank-data').textContent);
const CATS=DATA.cats, BOOKS=DATA.books||{}, ORUN=DATA.orun||{ele:{books:[]},mid:{books:[]}};
const byId={}; CATS.forEach(c=>byId[c.id]=c);
const GRADES=['중1','중2','중3','고등'], LVS=['상','중','하'];
const CIRC=['①','②','③','④','⑤'];

const S={page:'wizard',grade:'중1',book:null,step:1,mode:'book',
  cat:null,lv:'전체',ty:'전체',key:false,sel:new Set(),open:new Set([1]),
  total:20,lvN:{상:5,중:8,하:7},tyN:{mc:15,short:5},noDup:true,title:'',
  exam:null,sheet:null,answers:{},report:null,
  bkT:'ele',bkB:null,bkC:null,bkI:null,bkTab:'chk',bkKey:false};

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=s=>esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function shuf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const norm=s=>String(s||'').toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ').trim();
const okShort=(q,v)=>{const n=norm(v);return !!n&&[q.answer].concat(q.alt||[]).some(a=>norm(a)===n);};
const gcats=g=>CATS.filter(c=>c.grade===g);
function ripple(e){const b=e.currentTarget,r=b.getBoundingClientRect(),d=document.createElement('span');
  d.className='rp';const s=Math.max(r.width,r.height);
  d.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
  b.appendChild(d);setTimeout(()=>d.remove(),620);}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},900);}

/* ── 출제 계획 ── */
function planMatrix(N,lvN,tyN){
  const out=[];
  LVS.forEach(l=>{const n=lvN[l]||0; if(!n)return;
    let mc=Math.round(n*(tyN.mc/Math.max(1,N))); mc=Math.max(0,Math.min(mc,n));
    out.push({level:l,type:'mc',need:mc},{level:l,type:'short',need:n-mc});});
  let cur=out.filter(o=>o.type==='mc').reduce((s,o)=>s+o.need,0), guard=0;
  while(cur!==tyN.mc&&guard++<200){
    const up=cur<tyN.mc;
    const src=out.filter(o=>o.type===(up?'short':'mc')&&o.need>0).sort((a,b)=>b.need-a.need)[0];
    if(!src)break;
    const dst=out.find(o=>o.level===src.level&&o.type!==src.type);
    if(!dst)break;
    src.need--;dst.need++;cur+=up?1:-1;
  }
  return out.filter(o=>o.need>0);
}
function pool(ids,levels,types){
  const P=[];ids.forEach(id=>{const c=byId[id];if(!c)return;
    c.questions.forEach(q=>{if(levels.indexOf(q.level)<0)return;if(types.indexOf(q.type)<0)return;
      P.push(Object.assign({cat:c.name,catId:c.id,grade:c.grade},q));});});
  return P;}
function pickQuestions(cfg){
  const rnd=mulberry(cfg.seed);
  const used=cfg.noDup?new Set(JSON.parse(localStorage.getItem('og.used')||'[]')):new Set();
  let out=[];
  planMatrix(cfg.total,cfg.lvN,cfg.tyN).forEach(m=>{
    let P=pool(cfg.cats,[m.level],[m.type]);
    const fresh=P.filter(q=>!used.has(q.catId+'#'+q.no));
    P=shuf(fresh.length>=m.need?fresh:P,rnd);
    out=out.concat(P.slice(0,m.need));});
  out=shuf(out,rnd);
  out.sort((a,b)=>a.type===b.type?0:(a.type==='mc'?-1:1));
  return out.map((q,i)=>Object.assign({},q,{seq:i+1}));}
function poolStat(ids){
  const r={상:{mc:0,short:0},중:{mc:0,short:0},하:{mc:0,short:0},all:0};
  ids.forEach(id=>{const c=byId[id];if(!c)return;c.questions.forEach(q=>{r[q.level][q.type]++;r.all++;});});
  return r;}
const encCfg=c=>'OG2.'+btoa(unescape(encodeURIComponent(JSON.stringify(c))));
function decCfg(x){try{if(!/^OG[12]\./.test(x))return null;return JSON.parse(decodeURIComponent(escape(atob(x.slice(4)))));}catch(e){return null;}}

/* ── 내비 ── */
const PAGES=[['wizard','시험지 출제 마법사'],['bank','문제은행'],['books','옳은영어 교재'],['take','학생 응시'],['rec','응시 기록']];
function nav(p){S.page=p;if(p!=='take'){S.sheet=null;S.report=null;}render();window.scrollTo({top:0,behavior:'smooth'});}
function setGrade(g){S.grade=g;S.book=null;S.cat=null;render();}
function render(){
  document.getElementById('nav').innerHTML=PAGES.map(function(p){
    return '<button class="'+(S.page===p[0]?'on':'')+'" onclick="nav(\''+p[0]+'\')">'+p[1]+'</button>';}).join('');
  const v=document.getElementById('view');
  v.innerHTML = S.page==='wizard'?wizard() : S.page==='bank'?(S.cat?catView():bankView()) :
                S.page==='books'?booksView() :
                S.page==='take'?(S.report?reportView():(S.sheet?takeView():takeSetup())) : recView();
  v.classList.toggle('showkey',S.key||(S.page==='books'&&S.bkKey));
  Array.prototype.forEach.call(v.querySelectorAll('.btn'),b=>b.addEventListener('click',ripple));
  if(S.page==='take'&&S.report) setTimeout(drawReport,60);
  if(S.page==='wizard'&&S.step===2&&S.exam) setTimeout(()=>buildPaper(S.exam,false,'pv'),40);
}

/* ── 1. 마법사 ── */
function sidebar(){
  const brow=(g,b)=>{const on=S.grade===g&&S.book===b.pub;
    return '<div class="row '+(on?'on':'')+'" onclick="pickBook(\''+g+'\',\''+b.pub.replace(/'/g,"\\'")+'\')">'+
      '<span class="dot"></span><span>'+esc(b.pub)+'</span><span class="n">'+b.lessons.length+'과</span></div>';};
  const arow=g=>'<div class="row all '+(S.grade===g&&!S.book?'on':'')+'" onclick="setGrade(\''+g+'\')">'+
      '<span class="dot"></span><span>'+g+' 전체 문법</span><span class="n">'+gcats(g).length+'</span></div>';
  let h='<div class="card side"><div class="ttl"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/></svg>학년 · 교재<span class="r">'+
    Object.keys(BOOKS).reduce((s,k)=>s+BOOKS[k].length,0)+'종</span></div><div class="grp">중등</div>';
  ['중1','중2','중3'].forEach(g=>{h+=arow(g); if(S.grade===g)(BOOKS[g]||[]).forEach(b=>{h+=brow(g,b);});});
  h+='<div class="grp">고등 · 공통영어</div>'+arow('고등');
  if(S.grade==='고등')(BOOKS['고등']||[]).forEach(b=>{h+=brow('고등',b);});
  return h+'</div>';
}
function pickBook(g,p){S.grade=g;S.book=p;S.mode='book';S.open=new Set([1]);render();}
function wizard(){
  return '<div class="layout">'+sidebar()+'<div>'+
   '<div class="steps">'+
   '<div class="step '+(S.step===1?'on':'done')+'"><b>'+(S.step>1?'✓':'1')+'</b>문항 검색<small>단원 · 난이도 선택</small></div>'+
   '<div class="step '+(S.step===2?'on':'')+'"><b>2</b>시험지 만들기<small>인쇄 · Word · 배포</small></div></div>'+
   (S.step===1?step1():step2())+'</div></div>';
}
function step1(){
  const ids=Array.from(S.sel), stat=poolStat(ids), N=S.total;
  const lvSum=LVS.reduce((s,l)=>s+(S.lvN[l]||0),0), tySum=S.tyN.mc+S.tyN.short;
  const enough=LVS.every(l=>(stat[l].mc+stat[l].short)>=(S.lvN[l]||0));
  const ok=S.sel.size>0&&lvSum===N&&tySum===N&&N>0&&enough;
  let msg;
  if(!S.sel.size) msg='<span class="warn">단원 또는 문법 항목을 선택하세요.</span>';
  else if(lvSum!==N) msg='<span class="warn">난이도 합계 '+lvSum+' ≠ 총 '+N+'문항</span>';
  else if(tySum!==N) msg='<span class="warn">유형 합계 '+tySum+' ≠ 총 '+N+'문항</span>';
  else if(!enough) msg='<span class="warn">선택 범위에 해당 난이도 문항이 부족합니다.</span>';
  else msg='<span class="okmsg">✓ 선택 범위 '+stat.all.toLocaleString()+'문항 중 '+N+'문항을 출제합니다.</span>';
  return '<div class="card solid" style="margin-bottom:16px">'+
   '<div class="ttl"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Step 1. 문항 검색'+
   '<span class="r">'+(S.book?esc(S.grade+' · '+S.book):esc(S.grade)+' 전체 문법')+'</span></div>'+
   (S.book?'<div class="mode">'+
     '<button class="'+(S.mode==='book'?'on':'')+'" onclick="S.mode=\'book\';render()">교과서 단원별</button>'+
     '<button class="'+(S.mode==='cat'?'on':'')+'" onclick="S.mode=\'cat\';render()">문법 카테고리별</button></div>':'')+
   ((S.book&&S.mode==='book')?treeBook():treeCat())+
   '<div style="display:flex;gap:8px;margin-top:11px;align-items:center;flex-wrap:wrap">'+
   '<button class="btn ghost sm" onclick="selAll(1)">범위 전체 선택</button>'+
   '<button class="btn ghost sm" onclick="selAll(0)">선택 해제</button>'+
   '<span class="hint" style="margin-left:auto">선택 <b style="color:var(--ink)">'+S.sel.size+'</b>개 항목 · 보유 '+stat.all.toLocaleString()+'문항</span></div></div>'+
   '<div class="card solid"><div class="ttl"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>출제 옵션</div>'+
   '<div class="opt">'+
   '<label>총 문항수</label><div class="pills">'+[10,15,20,25,30,35,40,45,50].map(n=>
     '<button class="pill '+(S.total===n?'on':'')+'" onclick="setTotal('+n+')">'+n+'</button>').join('')+
     '<input class="num" type="number" min="1" max="200" value="'+S.total+'" onchange="setTotal(+this.value||1)"></div>'+
   '<label>난이도 구성</label><div class="lvbox">'+LVS.map(l=>
     '<span class="lvchip"><span style="color:'+(l==='상'?'var(--red)':l==='중'?'var(--gold2)':'var(--green)')+'">'+l+'</span>'+
     '<input class="num" type="number" min="0" value="'+(S.lvN[l]||0)+'" onchange="S.lvN[\''+l+'\']=Math.max(0,+this.value||0);render()"></span>').join('')+
     '<span class="hint">보유 '+LVS.map(l=>l+' '+(stat[l].mc+stat[l].short)).join(' · ')+'</span></div>'+
   '<label>문항 유형</label><div class="lvbox">'+
     '<span class="lvchip"><span style="color:var(--blue)">객관식</span><input class="num" type="number" min="0" value="'+S.tyN.mc+'" onchange="S.tyN.mc=Math.max(0,+this.value||0);render()"></span>'+
     '<span class="lvchip"><span style="color:var(--gold2)">주관식</span><input class="num" type="number" min="0" value="'+S.tyN.short+'" onchange="S.tyN.short=Math.max(0,+this.value||0);render()"></span>'+
     '<span class="hint">보유 객관식 '+LVS.reduce((s,l)=>s+stat[l].mc,0)+' · 주관식 '+LVS.reduce((s,l)=>s+stat[l].short,0)+'</span></div>'+
   '<label>중복 출제</label><div class="lvbox"><span class="sw '+(S.noDup?'on':'')+'" onclick="S.noDup=!S.noDup;render()"><i></i>이전에 출제한 문항 제외</span></div>'+
   '<label>시험 제목</label><div><input class="txt" type="text" placeholder="예: 2학기 중간고사 대비 문법 TEST" value="'+esc(S.title)+'" onchange="S.title=this.value"></div>'+
   '</div><div style="display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap">'+msg+
   '<button class="btn gold" style="margin-left:auto" '+(ok?'':'disabled')+' onclick="makeExam()">시험지 만들기 →</button></div></div>';
}
function setTotal(n){n=Math.max(1,Math.min(200,n));S.total=n;
  const a=Math.round(n*.25),b=Math.round(n*.4);S.lvN={상:a,중:b,하:n-a-b};
  const m=Math.round(n*.75);S.tyN={mc:m,short:n-m};render();}
function treeBook(){
  const bk=(BOOKS[S.grade]||[]).filter(b=>b.pub===S.book)[0];
  if(!bk) return '<p class="hint">교재를 선택하세요.</p>';
  return '<div class="tree">'+bk.lessons.map(L=>{
    const all=L.ids.length>0&&L.ids.every(i=>S.sel.has(i)), op=S.open.has(L.no);
    return '<div class="les '+(op?'op ':'')+(all?'allsel':'')+'">'+
      '<div class="h" onclick="tog('+L.no+')"><span class="cv">▶</span>'+
      '<span class="chk" onclick="event.stopPropagation();selLesson('+L.no+','+(all?0:1)+')"><svg viewBox="0 0 14 14"><path d="M2 7.5 5.5 11 12 3.5"/></svg></span>'+
      '<span>Lesson '+L.no+'</span><span class="lb">'+esc(L.labels.join(' · '))+'</span>'+
      '<span style="margin-left:auto;font-size:11px;color:var(--sub2);font-weight:600">'+L.ids.length+'</span></div>'+
      '<div class="b">'+(L.ids.length?L.ids.map(itRow).join(''):'<div class="it" style="color:var(--sub2)">문제은행 미수록 단원</div>')+'</div></div>';
  }).join('')+'</div>';
}
function treeCat(){return '<div class="tree">'+gcats(S.grade).map(c=>itRow(c.id)).join('')+'</div>';}
function itRow(id){const c=byId[id];if(!c)return '';
  return '<div class="it '+(S.sel.has(id)?'sel':'')+'" onclick="tsel(\''+id+'\')">'+
    '<span class="chk"><svg viewBox="0 0 14 14"><path d="M2 7.5 5.5 11 12 3.5"/></svg></span>'+
    (c.grade!==S.grade?'<span class="gd">'+c.grade+'</span>':'')+
    '<span>'+esc(c.name)+'</span><span class="qn">'+c.questions.length+'</span></div>';}
function tog(n){S.open.has(n)?S.open.delete(n):S.open.add(n);render();}

let CRC=null;
function crc32(u8){
  if(!CRC){CRC=new Uint32Array(256);
    for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);CRC[n]=c>>>0;}}
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=CRC[(c^u8[i])&255]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
function zipStore(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  files.forEach(f=>{
    const data=typeof f.data==='string'?enc.encode(f.data):f.data;
    const nm=enc.encode(f.name), crc=crc32(data);
    const loc=[80,75,3,4].concat(u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nm.length),u16(0));
    parts.push(new Uint8Array(loc),nm,data);
    cen.push({nm:nm,crc:crc,len:data.length,off:off});
    off+=loc.length+nm.length+data.length;
  });
  const cd=[]; let cdl=0;
  cen.forEach(c=>{
    const hh=[80,75,1,2].concat(u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c.crc),u32(c.len),u32(c.len),
      u16(c.nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off));
    cd.push(new Uint8Array(hh),c.nm); cdl+=hh.length+c.nm.length;
  });
  cd.push(new Uint8Array([80,75,5,6].concat(u16(0),u16(0),u16(cen.length),u16(cen.length),u32(cdl),u32(off),u16(0))));
  return new Blob(parts.concat(cd),{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function wRuns(t,o){
  o=o||{}; const out=[], P=[]; let last=0,m; const re=/<u>([\s\S]*?)<\/u>/g;
  while((m=re.exec(t))){ if(m.index>last)P.push([t.slice(last,m.index),0]); P.push([m[1],1]); last=re.lastIndex; }
  if(last<t.length)P.push([t.slice(last),0]);
  P.forEach(p=>{ String(p[0]).split('\n').forEach((line,i)=>{
    if(i) out.push('<w:r><w:br/></w:r>');
    out.push('<w:r><w:rPr>'+(o.b?'<w:b/>':'')+(p[1]?'<w:u w:val="single"/>':'')+
      (o.c?'<w:color w:val="'+o.c+'"/>':'')+'<w:sz w:val="'+(o.sz||20)+'"/><w:szCs w:val="'+(o.sz||20)+'"/></w:rPr>'+
      '<w:t xml:space="preserve">'+X(line)+'</w:t></w:r>');});});
  return out.join('');
}
function wP(runs,o){o=o||{};
  return '<w:p><w:pPr><w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after||40)+'" w:line="'+(o.line||264)+'" w:lineRule="auto"/>'+
    (o.ind?'<w:ind w:left="'+o.ind+'" w:hanging="'+(o.hang||0)+'"/>':'')+
    (o.align?'<w:jc w:val="'+o.align+'"/>':'')+
    (o.bdr?'<w:pBdr><w:bottom w:val="single" w:sz="'+o.bdr+'" w:space="4" w:color="0F1B2D"/></w:pBdr>':'')+
    '</w:pPr>'+runs+'</w:p>';}
function docxBlob(exam,withKey){
  const cfg=exam.cfg, qs=exam.qs, per=Math.floor(100/qs.length), ex=100-per*qs.length;
  const PG='<w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1020" w:right="900" w:bottom="1020" w:left="900" w:header="0" w:footer="0" w:gutter="0"/>';
  const SEC1='<w:sectPr><w:type w:val="continuous"/>'+PG+'<w:cols w:num="1"/></w:sectPr>';
  const SEC2='<w:sectPr><w:type w:val="continuous"/>'+PG+'<w:cols w:num="2" w:space="420" w:sep="1"/></w:sectPr>';
  let b='';
  b+=wP(wRuns('ORUN GRAMMAR · '+cfg.grade+(cfg.book?' · '+cfg.book:''),{b:1,sz:15,c:'8A97A8'}),{after:20});
  b+=wP(wRuns(cfg.title,{b:1,sz:32}),{after:70,bdr:18});
  b+=wP(wRuns('학년/반 ____________     이름 ____________     점수 ________ / 100     (총 '+qs.length+'문항)',{sz:18,c:'44506A'}),{after:50});
  b+=wP(wRuns('객관식은 ①~⑤ 중 하나를, 주관식은 빈칸에 알맞은 말을 정확히 쓰시오.',{sz:16,c:'8A97A8'}),{after:110});
  b+='<w:p><w:pPr>'+SEC1+'</w:pPr></w:p>';
  qs.forEach((q,i)=>{
    const pts=per+(i<ex?1:0);
    b+=wP(wRuns(q.seq+'. ',{b:1,sz:20})+wRuns('['+q.level+'·'+pts+'점] ',{sz:14,c:'A8B2BF'})+wRuns(q.stem,{sz:20}),
      {before:i?120:0,after:30,ind:260,hang:260});
    if(q.type==='mc') q.choices.forEach((c,j)=>{b+=wP(wRuns(CIRC[j]+' '+c,{sz:19}),{after:14,ind:400});});
    else b+=wP(wRuns('▶ __________________________________',{sz:19,c:'9AA6B4'}),{after:20,ind:400});
  });
  let tail='';
  if(withKey){
    tail+='<w:p><w:pPr>'+SEC2+'</w:pPr></w:p>';
    tail+=wP(wRuns('ANSWER & EXPLANATION',{b:1,sz:15,c:'8A97A8'}),{after:20});
    tail+=wP(wRuns(cfg.title+' — 정답 및 해설',{b:1,sz:28}),{after:70,bdr:18});
    qs.forEach(q=>{
      tail+=wP(wRuns(q.seq+'. ',{b:1,sz:19})+
        wRuns(q.type==='mc'?CIRC[q.answer-1]+' '+q.choices[q.answer-1]:q.answer,{b:1,sz:19,c:'B8332E'})+
        wRuns('   '+q.why,{sz:18})+wRuns('   ('+q.cat+')',{sz:15,c:'A8B2BF'}),{after:26,ind:280,hang:280});
    });
    tail+=SEC1.replace('<w:type w:val="continuous"/>','');
  } else tail+=SEC2;
  const doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+b+tail+'</w:body></w:document>';
  return zipStore([
   {name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
     '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
     '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
     '<Default Extension="xml" ContentType="application/xml"/>'+
     '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
     '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>'},
   {name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
     '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
     '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'},
   {name:'word/_rels/document.xml.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
     '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
     '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
   {name:'word/styles.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
     '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr>'+
     '<w:rFonts w:ascii="Noto Sans KR" w:hAnsi="Noto Sans KR" w:eastAsia="Noto Sans KR" w:cs="Noto Sans KR"/>'+
     '<w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr></w:rPrDefault></w:docDefaults></w:styles>'},
   {name:'word/document.xml',data:doc}]);
}

function cancelTest(){ if(confirm('응시를 취소할까요?')){S.sheet=null;render();} }
function answered(){return S.sheet.qs.filter(q=>{const a=S.answers[q.seq];return a!==undefined&&String(a).trim()!=='';}).length;}
function submitTest(){
  const cfg=S.sheet.cfg, qs=S.sheet.qs, left=qs.length-answered();
  if(left>0&&!confirm('아직 '+left+'문항이 비어 있습니다. 제출할까요?')) return;
  const per=Math.floor(100/qs.length), ex=100-per*qs.length;
  let sc=0; const rows=[],cat={},lvl={상:[0,0],중:[0,0],하:[0,0]};
  qs.forEach((q,i)=>{
    const pts=per+(i<ex?1:0), my=S.answers[q.seq];
    const ok=q.type==='mc'?my===q.answer:okShort(q,my);
    if(ok)sc+=pts;
    if(!cat[q.cat])cat[q.cat]=[0,0];
    cat[q.cat][1]++; if(ok)cat[q.cat][0]++;
    lvl[q.level][1]++; if(ok)lvl[q.level][0]++;
    rows.push({q:q,my:my,ok:ok,pts:pts});});
  S.report={score:sc,rows:rows,cat:cat,lvl:lvl,when:new Date(),cfg:cfg};
  const r=JSON.parse(localStorage.getItem('og.records')||'[]');
  r.unshift({name:TK.name,cls:TK.cls,title:cfg.title,grade:cfg.grade||'',
    date:new Date().toISOString().slice(0,16).replace('T',' '),
    score:sc,total:qs.length,right:rows.filter(x=>x.ok).length});
  localStorage.setItem('og.records',JSON.stringify(r.slice(0,400)));
  render();window.scrollTo({top:0,behavior:'smooth'});
}

     '<button class="pill '+(isChk?'on':'')+'" onclick="S.bkTab=\'chk\';render()">'+T.check+'</button>'+
     '<button class="pill '+(!isChk?'on':'')+'" onclick="S.bkTab=\'rec\';render()">'+T.recall+'</button>'+
     '<span style="margin-left:auto;display:flex;gap:7px;align-items:center">'+
     '<button class="btn ghost sm" onclick="printOrun()">인쇄</button>'+
     '<button class="btn ghost sm" onclick="docxOrun()">Word 저장</button>'+
     '<button class="keybtn '+(S.bkKey?'on':'')+'" onclick="S.bkKey=!S.bkKey;render()">'+
     (S.bkKey?'정답 숨기기':'정답 보기')+'</button></span></div></div>'+
   (isChk?chkHtml(it):recHtml(it));
}
function chkHtml(it){
  const key={}; (it.chk.answerKey||[]).forEach(k=>{key[k.no]=k;});
  return it.chk.questions.map(q=>{
    let h='';
    if(q.groupHeader) h+='<div style="background:var(--blueBg);border-left:3px solid var(--navy);border-radius:8px;'+
      'padding:8px 13px;margin:14px 0 8px;font-weight:700;font-size:13.5px">'+fmt(q.groupHeader)+'</div>';
    let body='';
    if(q.stem) body+='<div class="stem">'+fmt(q.stem)+'</div>';
    if(q.bank&&q.bank.length) body+='<div style="display:flex;gap:10px;align-items:center;background:#f6f8fb;'+
      'border:1px solid var(--line);border-radius:10px;padding:8px 13px;margin:8px 0;font-size:13.5px">'+
      '<b style="color:var(--sub);font-size:11.5px;flex:none">보기</b><span>'+q.bank.map(fmt).join('&nbsp; &nbsp;')+'</span></div>';
    if(q.bullets&&q.bullets.length) body+='<div style="margin:7px 0 0;padding-left:4px">'+
      q.bullets.map(x=>'<div style="margin:3px 0">· '+fmt(x)+'</div>').join('')+'</div>';
    if(q.choices&&q.choices.length) body+='<ol class="ch">'+q.choices.map((c,i)=>'<li>'+CIRC[i]+' '+fmt(c)+'</li>').join('')+'</ol>';
    const k=key[q.no]||{};
    return h+'<div class="q"><div class="head"><span class="num">'+String(q.no).padStart(2,'0')+'</span>'+
      '<div style="flex:1;min-width:0">'+body+'</div></div>'+
      '<div class="ans"><b>정답</b> '+fmt(k.answer||'')+'<div class="why">'+esc(k.why||'')+'</div></div></div>';
  }).join('');
}
function recHtml(it){
  return (it.rec.sections||[]).map(sec=>
    '<div class="card solid" style="margin-bottom:12px">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'+
    '<span style="background:var(--navy);color:#fff;border-radius:9px;padding:5px 12px;font-weight:800;font-size:12.5px">'+
    esc(sec.label||sec.kind)+'</span>'+
    '<span style="color:var(--sub);font-size:13px">'+esc(sec.instruction||'')+'</span></div>'+
    sec.rows.map((r,i)=>'<div class="q" style="margin-bottom:7px"><div class="head">'+
      '<span class="num">'+String(i+1).padStart(2,'0')+'</span>'+
      '<div style="flex:1;min-width:0"><div class="stem">'+fmt(r.prompt||'')+'</div>'+
      '<div style="border-bottom:1px dashed var(--line);height:'+((r.lines||1)*20)+'px;margin-top:6px"></div></div></div>'+
      '<div class="ans"><b>정답</b> '+fmt(r.answer||'')+'<div class="why">'+esc(r.why||'')+'</div></div></div>').join('')+
    '</div>').join('');
}
/* 옳은영어 교재 시험지 인쇄 */
function orunPaper(withKey){
  const T=oTrack(), b=oBook(), it=oItem(), isChk=S.bkTab==='chk';
  const kind=isChk?T.check:T.recall;
  const head='<div class="exh"><div class="lft"><div class="bar"></div><div>'+
    '<div class="t0">'+esc(T.vol)+' · '+esc(b.short)+'</div>'+
    '<div class="t1">'+esc(it.t)+'</div></div></div>'+
    '<div class="rgt"><b>'+esc(kind)+'</b>'+esc(it.src||'')+'</div></div>'+
    '<div class="exi"><div><span>학년/반</span><i></i></div><div><span>이름</span><i></i></div>'+
    '<div class="sc"><span>점수</span><i>&nbsp; &nbsp; / 100</i></div></div>';
  let body='';
  if(isChk){
    const key={};(it.chk.answerKey||[]).forEach(k=>{key[k.no]=k;});
    body='<div class="excols">'+it.chk.questions.map(q=>{
      let h='<div class="pq">';
      if(q.groupHeader) h+='<div style="background:#eef4ff;border-left:2.5px solid #0f1b2d;border-radius:4px;'+
        'padding:3px 7px;margin-bottom:4px;font-weight:800;font-size:10px">'+fmt(q.groupHeader)+'</div>';
      h+='<div class="ph"><span class="pn">'+q.no+'</span></div>';
      if(q.stem) h+='<div class="pstem">'+fmt(q.stem)+'</div>';
      if(q.bank&&q.bank.length) h+='<div style="border:1px solid #d8dfe9;border-radius:4px;padding:3px 7px;'+
        'margin:3px 0;font-size:10px"><b style="color:#8a97a8;font-size:8.5px">보기</b> '+q.bank.map(fmt).join('&nbsp; ')+'</div>';
      if(q.bullets&&q.bullets.length) h+='<div style="font-size:10.4px;line-height:1.6;margin-top:2px">'+
        q.bullets.map(x=>'· '+fmt(x)).join('<br>')+'</div>';
      if(q.choices&&q.choices.length){const long=q.choices.some(c=>c.length>16);
        h+='<ol class="'+(long?'':'two')+'">'+q.choices.map((c,i)=>'<li>'+CIRC[i]+' '+fmt(c)+'</li>').join('')+'</ol>';}
      else h+='<div class="line"></div>';
      return h+'</div>';}).join('')+'</div>';
  } else {
    body=(it.rec.sections||[]).map(sec=>
      '<div style="margin-bottom:7mm"><div style="display:flex;gap:8px;align-items:center;margin-bottom:5px">'+
      '<span style="background:#0f1b2d;color:#fff;border-radius:4px;padding:2px 9px;font-weight:800;font-size:9.5px">'+
      esc(sec.label||'')+'</span><span style="font-size:9.8px;color:#5b6b7c">'+esc(sec.instruction||'')+'</span></div>'+
      sec.rows.map((r,i)=>'<div class="pq" style="margin-bottom:4mm"><div class="ph"><span class="pn">'+(i+1)+'</span></div>'+
        '<div class="pstem">'+fmt(r.prompt||'')+'</div>'+
        '<div class="line" style="height:'+((r.lines||1)*13)+'px"></div></div>').join('')+'</div>').join('');
  }
  let h='<div class="sheet">'+head+'<div style="height:9px"></div>'+body+
    '<div class="exf"><b>ORUN GRAMMAR</b>&nbsp;· '+esc(T.vol)+' '+esc(kind)+'<span class="pg">1</span></div></div>';
  if(withKey){
    h+='<div class="sheet"><div class="keyh"><div class="bar"></div><div><div class="t0">ANSWER &amp; EXPLANATION</div>'+
      '<div class="t1">'+esc(it.t)+' — '+esc(kind)+' 정답 및 해설</div></div>'+
      '<div class="rgt"><b>'+esc(T.vol)+'</b>교사용</div></div>'+
      '<table class="ktab"><tr><th style="width:24px">No</th><th style="width:170px">정답</th><th>해설</th></tr>'+
      (isChk? (it.chk.answerKey||[]).map(k=>'<tr><td class="n">'+k.no+'</td><td class="a">'+fmt(k.answer||'')+
          '</td><td>'+esc(k.why||'')+'</td></tr>').join('')
        : (it.rec.sections||[]).map(sec=>'<tr><td colspan="3" style="background:#f6f8fb;font-weight:800">'+
            esc(sec.label||'')+'</td></tr>'+sec.rows.map((r,i)=>'<tr><td class="n">'+(i+1)+'</td><td class="a">'+
            fmt(r.answer||'')+'</td><td>'+esc(r.why||'')+'</td></tr>').join('')).join(''))+
      '</table><div class="exf"><b>ORUN GRAMMAR</b>&nbsp;· 정답 및 해설<span class="pg">2</span></div></div>';
  }
  return h;
}
function printOrun(){document.getElementById('paper').innerHTML=orunPaper(S.bkKey);setTimeout(()=>window.print(),150);}
function docxOrun(){
  const T=oTrack(), b=oBook(), it=oItem(), isChk=S.bkTab==='chk';
  const kind=isChk?T.check:T.recall;
  const qs=[];
  if(isChk){
    const key={};(it.chk.answerKey||[]).forEach(k=>{key[k.no]=k;});
    it.chk.questions.forEach(q=>{
      let stem=(q.groupHeader?q.groupHeader+'\n':'')+(q.stem||'');
      if(q.bank&&q.bank.length) stem+='\n[보기] '+q.bank.join('   ');
      if(q.bullets&&q.bullets.length) stem+='\n'+q.bullets.map(x=>'· '+x).join('\n');
      const k=key[q.no]||{};
      qs.push({seq:q.no,level:'중',type:(q.choices&&q.choices.length)?'mc':'short',
        stem:stem.trim(),choices:q.choices&&q.choices.length?q.choices:null,
        answer:(q.choices&&q.choices.length)?Math.max(1,q.choices.indexOf(k.answer)+1):(k.answer||''),
        why:k.why||'',cat:it.t});
    });
  } else {
    let n=0;
    (it.rec.sections||[]).forEach(sec=>{sec.rows.forEach(r=>{n++;
      qs.push({seq:n,level:'중',type:'short',stem:'['+(sec.label||'')+'] '+(r.prompt||''),
        choices:null,answer:r.answer||'',why:r.why||'',cat:it.t});});});
  }
  const exam={cfg:{title:it.t+' — '+kind,grade:T.vol,book:b.short},qs:qs};
  try{ dl(docxBlob(exam,true),(b.short+'_'+it.t+'_'+kind).replace(/[\\/:*?"<>|]/g,'-')+'.docx');
       toast('Word 파일을 저장했습니다'); }
  catch(e){ toast('Word 생성 실패: '+e.message); }
}

setTotal(20); S.step=1; render();
</script>
