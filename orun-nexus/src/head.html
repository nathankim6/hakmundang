/* ============================================================
   ORUN NEXUS UNIVERSE — three curriculum galaxies in one sky
   Single committed visual world (dark holo HUD). Every colour
   is painted explicitly so the page never borrows a host ground.
   ============================================================ */
:root{
  --void:#061424;
  --deep:#0a1e33;
  --deeper:#071827;
  --panel:rgba(11,32,54,.88);
  --panel-solid:#0c2138;
  --edge:rgba(41,168,255,.20);
  --edge-hot:rgba(41,168,255,.48);
  --holo:#29a8ff;
  --holo-soft:#7fd8ff;
  --reactor:#4fd8ff;
  --deepcyan:#155a80;
  --gold:#ffd100;          /* ORUN yellow — the lighthouse beam */
  --gold-soft:#ffe566;
  --gold-dim:#7a6404;
  --orun-blue:#1795d3;
  --ember:#ff8a3d;
  --text:#bcd8ee;
  --text-dim:#6f96b4;
  --text-faint:#446c8c;
  --paper:#ffffff;
  --ink:#15191d;
  --ink-soft:#4a5158;
  --crit:#ff6b5a;

  --f-hud:'Noto Sans','Noto Sans KR',system-ui,-apple-system,sans-serif;
  --f-kr:'Noto Sans KR','Noto Sans',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  --f-mono:'Noto Sans Mono',ui-monospace,SFMono-Regular,monospace;

  --rail:346px;
  --topbar:52px;
  --botbar:30px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--void);
  color:var(--text);
  font-family:var(--f-kr);
  font-size:14px;
  line-height:1.6;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ── ambient field ─────────────────────────────────────────── */
/* the vignette belongs to the 3D stage; over the paper rails it just
   dirtied the white, worst in the corners where it is strongest */
#stage::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
  background:
    radial-gradient(ellipse 116% 84% at 50% 48%,transparent 44%,rgba(2,9,22,.80) 100%),
    repeating-linear-gradient(0deg,rgba(41,168,255,.022) 0 1px,transparent 1px 3px);
}

/* ── shell ─────────────────────────────────────────────────── */
#app{display:grid;grid-template-rows:var(--topbar) 1fr var(--botbar);height:100dvh;
     width:100%;max-width:100vw;overflow:hidden}

.bar{
  display:flex;align-items:center;gap:11px;padding:0 13px;min-width:0;overflow:hidden;
  border-bottom:1px solid var(--edge);
  background:linear-gradient(180deg,rgba(10,26,42,.94),rgba(5,13,23,.86));
  position:relative;z-index:20;
}
.bar.bot{border-bottom:none;border-top:1px solid var(--edge);font-size:10.5px}

.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{
  font-family:var(--f-hud);font-weight:700;font-size:17px;letter-spacing:.13em;
  color:var(--holo-soft);text-shadow:0 0 14px rgba(41,168,255,.5);white-space:nowrap;
}
.brand span{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.24em;color:var(--text-faint);
  text-transform:uppercase;white-space:nowrap;
}
.bar .spacer{flex:1}

.readout{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--text-faint);
  text-transform:uppercase;display:flex;gap:6px;align-items:center;white-space:nowrap;
}
.readout b{color:var(--holo);font-weight:500}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
@media(prefers-reduced-motion:no-preference){.dot{animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}

.legend{display:flex;gap:9px;align-items:center;flex-wrap:nowrap}
.legend .cap{
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.16em;color:var(--text-faint);
  text-transform:uppercase;white-space:nowrap;
}
.legend .bar{
  position:relative;display:block;width:208px;height:5px;border-radius:3px;
  box-shadow:0 0 12px rgba(41,168,255,.28);
}
.legend .bar button{
  position:absolute;top:-7px;width:14px;height:19px;transform:translateX(-50%);
  display:grid;place-items:center;
}
.legend .bar button i{
  width:2px;height:13px;background:rgba(255,255,255,.55);border-radius:1px;
  transition:background .16s,height .16s;
}
.legend .bar button:hover i{background:#fff;height:17px}
@media(max-width:1520px){.legend{display:none}}

.tool{
  font-family:var(--f-hud);font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-dim);
  padding:5px 11px;border:1px solid var(--edge);border-radius:2px;
  transition:color .18s,border-color .18s,background .18s;white-space:nowrap;
}
.tool:hover{color:var(--holo);border-color:var(--edge-hot);background:rgba(41,168,255,.07)}
.fxsel{
  background:rgba(6,16,30,.72);color:var(--text-dim);cursor:pointer;
  text-transform:none;letter-spacing:.04em;padding-right:6px;
}
.fxsel option{background:#0a1729;color:#cfe0f2}
.tool[aria-pressed=true]{color:var(--gold);border-color:rgba(255,209,0,.5);background:rgba(255,209,0,.09)}

main{display:grid;grid-template-columns:var(--rail) 1fr;min-height:0;position:relative}
body.solo main{grid-template-columns:0 1fr}
body.solo .rail{opacity:0;pointer-events:none}

/* ── rails ─────────────────────────────────────────────────── */
.rail{
  min-height:0;overflow-y:auto;overflow-x:hidden;
  background:linear-gradient(180deg,rgba(8,20,33,.9),rgba(4,10,18,.94));
  position:relative;z-index:10;transition:opacity .35s;
}
.rail.l{border-right:1px solid var(--edge)}

.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-track{background:transparent}
.rail::-webkit-scrollbar-thumb{background:rgba(41,168,255,.18);border-radius:0}
.rail::-webkit-scrollbar-thumb:hover{background:rgba(41,168,255,.36)}

.rail-hd{
  position:sticky;top:0;z-index:3;padding:11px 15px 9px;
  background:linear-gradient(180deg,var(--deeper) 72%,rgba(5,13,23,0));
  border-bottom:1px solid var(--edge);
}
.rail-hd h2{
  margin:0;font-family:var(--f-hud);font-size:11px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--holo);
}
.rail-hd p{margin:3px 0 0;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;color:var(--text-faint)}

.rail-body{padding:14px 15px 22px;display:flex;flex-direction:column;gap:15px}
.rsec+.rsec{border-top:8px solid #eef2f6}
.rsec.last .rail-body{padding-bottom:44px}

.void-note{
  padding:26px 6px;text-align:center;color:var(--text-faint);
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;line-height:2;
}

/* chain: 큰개념 → 맵핑 → 세부설명 */
.chain{display:flex;flex-direction:column;gap:0}
.link{position:relative;padding-left:19px}
.link::before{
  content:'';position:absolute;left:5px;top:6px;width:7px;height:7px;
  border:1px solid var(--holo);background:var(--void);transform:rotate(45deg);
}
.link::after{content:'';position:absolute;left:8.5px;top:15px;bottom:-9px;width:1px;background:var(--edge)}
.link:last-child::after{display:none}
.link.on::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 9px var(--gold)}
.link + .link{margin-top:11px}
.link .tier{
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--text-faint);display:block;margin-bottom:1px;
}
.link .val{font-size:13px;font-weight:500;color:var(--text);line-height:1.45;word-break:keep-all}
.link.on .val{color:var(--gold-soft)}

.slab{border:1px solid var(--edge);background:rgba(6,16,27,.6);padding:11px 13px}
.slab h3{
  margin:0 0 7px;font-family:var(--f-hud);font-size:10px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--text-dim);
  display:flex;align-items:center;gap:7px;
}
.slab h3::after{content:'';flex:1;height:1px;background:var(--edge)}
.slab p{margin:0;font-size:12.5px;line-height:1.72;color:var(--text);word-break:keep-all}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px}
.kv dt{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);padding-top:3px;white-space:nowrap}
.kv dd{margin:0;color:var(--text);word-break:keep-all}
.kv dd.num{font-family:var(--f-mono);color:var(--holo)}

.prov{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--f-mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--gold);border:1px solid rgba(255,209,0,.34);background:rgba(255,209,0,.08);
  padding:2px 7px;border-radius:1px;
}
.prov::before{content:'';width:4px;height:4px;background:var(--gold);transform:rotate(45deg)}

ul.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.pts li{
  position:relative;padding-left:16px;font-size:12.5px;line-height:1.65;color:var(--text);
  word-break:keep-all;
}
ul.pts li::before{
  content:'';position:absolute;left:2px;top:8px;width:5px;height:1px;background:var(--holo);
  box-shadow:0 0 5px rgba(41,168,255,.7);
}

/* grade-differentiated ladder */
.rung{border-left:2px solid var(--deepcyan);padding:0 0 0 12px;position:relative}
.rung + .rung{margin-top:13px}
.rung.on{border-left-color:var(--gold)}
.rung .lv{
  font-family:var(--f-hud);font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--holo);margin-bottom:2px;display:flex;gap:8px;align-items:center;
}
.rung.on .lv{color:var(--gold)}
.rung .lv em{
  font-style:normal;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;
  color:var(--text-faint);text-transform:none;
}
.rung .bk{font-size:11.5px;color:var(--text-dim);margin-bottom:5px}
.rung .tp{font-size:12.5px;color:var(--text);line-height:1.6;word-break:keep-all}
.rung .depth{
  margin-top:6px;height:3px;background:rgba(41,168,255,.1);position:relative;overflow:hidden;
}
.rung .depth i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--deepcyan),var(--holo));box-shadow:0 0 8px rgba(41,168,255,.6)}
.rung.on .depth i{background:linear-gradient(90deg,var(--gold-dim),var(--gold));box-shadow:0 0 8px rgba(255,209,0,.6)}

/* ── stage ─────────────────────────────────────────────────── */
#stage{position:relative;min-width:0;overflow:hidden;background:
  radial-gradient(ellipse 62% 48% at 50% 43%,#0e2a4e 0%,#08182f 42%,transparent 74%),
  radial-gradient(ellipse 150% 95% at 50% 108%,#020a18,transparent 58%),
  #010610;}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}

.stage-tools{position:absolute;left:14px;bottom:14px;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--edge);background:rgba(6,20,36,.72);border-radius:2px;overflow:hidden}
.seg button{
  font-family:var(--f-hud);font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--text-dim);padding:5px 10px;white-space:nowrap;
  border-right:1px solid var(--edge);transition:color .16s,background .16s;
}
.seg button:last-child{border-right:none}
.seg button:hover:not(:disabled){color:var(--holo);background:rgba(41,168,255,.08)}
.seg button[aria-pressed=true]{color:#061424;background:var(--gold)}
.seg button:disabled{color:var(--text-faint);opacity:.45;cursor:not-allowed}
.stage-crumb{
  position:absolute;left:14px;top:13px;z-index:5;display:flex;align-items:center;gap:7px;
  flex-wrap:wrap;max-width:calc(100% - 28px);
}
.crumb{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.11em;color:var(--text-dim);
  padding:3px 9px;border:1px solid var(--edge);background:rgba(6,16,27,.72);
  transition:color .16s,border-color .16s;text-transform:uppercase;
}
.crumb:hover{color:var(--holo);border-color:var(--edge-hot)}
.crumb.tail{color:var(--gold);border-color:rgba(255,209,0,.42);background:rgba(255,209,0,.08)}
.crumb-sep{color:var(--text-faint);font-family:var(--f-mono);font-size:10px}

.hint{
  position:absolute;right:14px;bottom:14px;z-index:5;text-align:right;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;color:var(--text-faint);
  line-height:1.9;pointer-events:none;
}
.hint b{color:var(--holo);font-weight:500}

/* boot */
#boot{
  position:absolute;inset:0;z-index:30;display:grid;place-items:center;
  background:var(--void);
}
#boot .bootin{text-align:center}
#boot .bl{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;color:var(--holo);
  text-transform:uppercase;opacity:0;min-height:20px;
}
@media(prefers-reduced-motion:no-preference){
  #boot .bl{animation:blin .5s ease forwards}
}
@media(prefers-reduced-motion:reduce){#boot{display:none}}
@keyframes blin{to{opacity:1}}
#boot.gone{opacity:0;pointer-events:none;transition:opacity .8s ease}

/* ── modal ─────────────────────────────────────────────────── */
#modal{
  position:fixed;inset:0;z-index:80;display:none;
  background:rgba(2,6,12,.86);backdrop-filter:blur(7px);
}
#modal.open{display:grid;grid-template-rows:1fr;place-items:center;padding:22px}
.sheetwrap{
  width:min(1180px,100%);height:min(94dvh,100%);
  background:linear-gradient(180deg,#0a1a2b,#061119);
  border:1px solid var(--edge-hot);
  box-shadow:0 0 0 1px rgba(4,10,18,.9),0 30px 90px rgba(0,0,0,.8),0 0 70px rgba(41,168,255,.11);
  display:grid;grid-template-rows:auto auto 1fr auto;min-height:0;
}
.sheet-hd{
  display:flex;align-items:center;gap:14px;padding:13px 17px;
  border-bottom:1px solid var(--edge);
}
.sheet-hd .t{min-width:0;flex:1}
.sheet-hd .eyebrow{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--text-faint);
}
.sheet-hd h2{
  margin:1px 0 0;font-size:17px;font-weight:600;color:var(--gold-soft);
  text-wrap:balance;line-height:1.35;
}
.x{
  width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--edge);
  color:var(--text-dim);font-family:var(--f-hud);font-size:15px;flex:none;
}
.x:hover{color:var(--crit);border-color:rgba(255,107,90,.5)}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--edge);padding:0 17px;flex:none}
.tab{
  font-family:var(--f-hud);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-faint);padding:10px 16px;border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .18s,border-color .18s;
}
.tab:hover{color:var(--text-dim)}
.tab[aria-selected=true]{color:var(--holo);border-bottom-color:var(--holo)}
.tabs .spacer{flex:1}
/* 정답 보기는 눌렀는지 아닌지가 곧 "학생용이냐 교사용이냐"다 — 흐린 회색으로
   두면 정답이 깔린 채 인쇄되는 사고가 난다. 빨간 글씨로 먼저 눈에 걸리게. */
.tabs .keytog{
  font-family:var(--f-mono);font-size:10.5px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;
  color:var(--crit);padding:0 4px;align-self:center;
  border:1px solid rgba(255,107,90,.55);padding:3.5px 11px;margin:0 0 4px;border-radius:3px;
  background:rgba(255,107,90,.10);text-shadow:0 0 10px rgba(255,107,90,.40);
}
.tabs .keytog:hover{background:rgba(255,107,90,.22);border-color:rgba(255,107,90,.9)}
.tabs .keytog[aria-pressed=true]{
  color:#fff;background:rgba(255,74,58,.88);border-color:#ff9c8f;
  text-shadow:0 1px 2px rgba(0,0,0,.45);box-shadow:0 0 14px rgba(255,74,58,.35);
}

.preview{
  min-height:0;overflow:auto;padding:22px;background:
    radial-gradient(ellipse at 50% 0%,rgba(20,52,76,.34),transparent 60%),#040a12;
}
.preview::-webkit-scrollbar{width:9px;height:9px}
.preview::-webkit-scrollbar-thumb{background:rgba(41,168,255,.2)}
/* 조판은 A4 실치수(1pt = 4/3 CSS px)로 하고, 화면에서만 zoom 으로 줄인다.
   미리보기 배율로 조판하면 인쇄할 때 A4 한 장 안에 작게 박혀 나온다. */
.pages{display:flex;flex-direction:column;align-items:center;gap:20px;zoom:var(--pz,1)}

.page{
  position:relative;background:var(--paper);color:var(--ink);
  box-shadow:0 10px 40px rgba(0,0,0,.65);flex:none;
  font-family:var(--f-kr);
}
.page .opsvg{position:absolute;left:0;top:0;display:block}
.page .op{position:absolute;white-space:pre;transform-origin:0 0}

.sheet-ft{
  display:flex;align-items:center;gap:9px;padding:11px 17px;border-top:1px solid var(--edge);
  flex-wrap:wrap;
}
.sheet-ft .note{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;color:var(--text-faint);
  flex:1;min-width:150px;
}
.act{
  font-family:var(--f-hud);font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:8px 15px;border:1px solid var(--edge-hot);color:var(--holo);
  transition:background .18s,color .18s,box-shadow .18s;white-space:nowrap;
}
.act:hover:not(:disabled){background:rgba(41,168,255,.14);box-shadow:0 0 18px rgba(41,168,255,.24)}
.act.gold{border-color:rgba(255,209,0,.55);color:var(--gold)}
.act.gold:hover:not(:disabled){background:rgba(255,209,0,.14);box-shadow:0 0 18px rgba(255,209,0,.26)}
.act:disabled{opacity:.4;cursor:not-allowed}

#toast{
  position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(14px);
  z-index:120;background:var(--panel-solid);border:1px solid var(--edge-hot);
  padding:10px 18px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;
  color:var(--holo);opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;
  max-width:min(560px,90vw);text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{border-color:rgba(255,107,90,.6);color:var(--crit)}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}


/* ── side panels: paper against the dark stage ──────────────────────────
   The rails redefine the palette tokens for their own subtree, so every
   rule already written against those tokens flips without being touched.
   Fonts collapse to one family here: Noto Sans leads for Latin and digits,
   Noto Sans KR picks up Hangul, so the whole panel reads as one voice. */
.rail{
  --f-hud:'Noto Sans','Noto Sans KR',system-ui,sans-serif;
  --f-kr:'Noto Sans','Noto Sans KR',system-ui,sans-serif;
  --f-mono:'Noto Sans','Noto Sans KR',system-ui,sans-serif;
  /* body resolves var(--f-kr) against :root, so inherited text needs the
     family restated here — a redefined token alone does not reach it */
  font-family:var(--f-kr);
  font-feature-settings:'tnum' 1;
  --void:#ffffff;
  --deep:#ffffff;
  --deeper:#ffffff;
  --panel:#ffffff;
  --panel-solid:#ffffff;
  --edge:#dfe5ec;
  --edge-hot:#a9bccd;
  --holo:#0b6fb8;
  --holo-soft:#08557f;
  --reactor:#0b6fb8;
  --deepcyan:#c3ced9;
  --gold:#9a6a00;
  --gold-soft:#6f4c00;
  --gold-dim:#e8d9ac;
  --text:#16202c;
  --text-dim:#54677a;
  --text-faint:#8496a6;
  background:#ffffff;
  color:#16202c;
}
.rail.l{border-right:1px solid #cfd8e2;box-shadow:6px 0 22px rgba(2,8,16,.55)}

.rail::-webkit-scrollbar-thumb{background:#c3ced9}
.rail::-webkit-scrollbar-thumb:hover{background:#9aabbb}
.rail .rail-hd{
  background:linear-gradient(180deg,#ffffff 74%,rgba(255,255,255,0));
  border-bottom:1px solid #e4e9ef;
}
.rail .slab{background:#f6f8fb;border-color:#e2e8ef}
.rail .link::before{background:#ffffff}
.rail .link.on::before{background:var(--gold);border-color:var(--gold);box-shadow:none}
.rail ul.pts li::before{box-shadow:none;background:#0b6fb8}
.rail .prov{
  color:#8a5d00;border-color:#e6cf94;background:#fdf4dd;
}
.rail .prov::before{background:#c08d10}
.rail .kv dd.num,.rail .rung .depth+div{font-variant-numeric:tabular-nums}
.rail .rung .depth{background:#e7ecf2}
.pick{width:100%;font:inherit;font-size:12.5px;color:#16202c;background:#fff;
  border:1px solid #cbd4de;border-radius:2px;padding:7px 9px;cursor:pointer}
.pick:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.chlist{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.chlist button{
  display:flex;align-items:center;gap:8px;text-align:left;width:100%;
  padding:6px 8px;border-radius:2px;font-size:12.5px;color:#26333f;
  border-left:3px solid transparent;transition:background .14s,border-color .14s;
}
.chlist button:hover{background:#eef4fa}
.chlist button[aria-current=true]{background:#e9f1fa;border-left-color:var(--gold);color:#0b2740;font-weight:600}
.chlist .no{font-size:10.5px;color:#8496a6;min-width:32px;font-variant-numeric:tabular-nums}
.chlist .nm{flex:1;word-break:keep-all}
.chlist .cnt{font-size:10px;color:#8496a6;font-variant-numeric:tabular-nums}
.ulist{display:flex;flex-direction:column;gap:2px;margin:6px 0 4px 12px;
  border-left:1px solid #e0e6ec;padding-left:9px}
.ulist button{
  display:flex;align-items:center;gap:7px;text-align:left;width:100%;
  padding:5px 7px;border-radius:2px;font-size:12px;color:#3b4a58;transition:background .14s;
}
.ulist button:hover{background:#eef4fa}
.ulist button:disabled{color:#a4b0bb;cursor:default}
.ulist button.on{background:#fff6d6;color:#1b2733;font-weight:700}
.ulist button.on i{background:var(--gold);box-shadow:0 0 0 3px rgba(255,209,0,.28)}
.ulist button:disabled:hover{background:transparent}
.ulist i{width:6px;height:6px;border-radius:50%;flex:none;background:#cdd6df}
.ulist button.has i{background:#1f8f4d;box-shadow:0 0 0 2px #d8f0e2}
.rail .rung .depth i{box-shadow:none}
.rail .act{
